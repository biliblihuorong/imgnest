name: libvips base image

# Publishes ghcr.io/<owner>/imgnest-vips. Runs only when the base definition
# changes; every other image and CI job pulls the result instead of compiling
# libvips. Pull requests build without publishing.
on:
  push:
    branches: [main]
    paths:
      - deploy/Dockerfile.vips
      - .github/workflows/vips-base.yml
  pull_request:
    paths:
      - deploy/Dockerfile.vips
      - .github/workflows/vips-base.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vips-base-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/imgnest-vips
  # <libvips version>-r<revision>. Bump the revision whenever
  # deploy/Dockerfile.vips changes; consumers pin the resulting digests.
  TAG: 8.18.6-r1

jobs:
  # Each architecture compiles on a native runner.
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dev target
        id: dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.vips
          target: dev
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=vips-base-${{ matrix.arch }}
          cache-to: type=gha,scope=vips-base-${{ matrix.arch }},mode=max
      - name: Build runtime target
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.vips
          target: runtime
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=vips-base-${{ matrix.arch }}
      - name: Export digests
        if: github.event_name != 'pull_request'
        env:
          DEV_DIGEST: ${{ steps.dev.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/dev" "$RUNNER_TEMP/digests/runtime"
          touch "$RUNNER_TEMP/digests/dev/${DEV_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/runtime/${RUNTIME_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: vips-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch manifests
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: vips-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG-dev" $(cd dev && printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools create -t "$IMAGE:$TAG" $(cd runtime && printf "$IMAGE@sha256:%s " *)
      # These digests are what Dockerfile and Dockerfile.dev pin.
      - name: Print digests to pin
        run: |
          for ref in "$IMAGE:$TAG-dev" "$IMAGE:$TAG"; do
            echo "$ref@$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')" | tee -a "$GITHUB_STEP_SUMMARY"
          done
