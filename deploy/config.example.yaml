# Deployment settings. IMGNEST_ environment variables override these values.
# Keep database credentials in IMGNEST_DATABASE_DSN rather than this example.
server:
  addr: ":8080"
  trusted_proxies: []
  read_header_timeout: 5s
  shutdown_timeout: 10s
  max_upload_mb: 20 # per-file limit of groups without their own; a group may set any size
  max_request_mb: 64
  upload_concurrency: 2
  processing_timeout: 5m
  max_pixels: 100000000

images:
  thumb_cache: data/thumbs
  # Browser origins (your blog) allowed to call /api/variants; "*" allows any.
  variant_cors_origins: []
  variant_lookup_per_minute: 60
  # How long a CDN may keep a /api/variants answer (s-maxage). 0s leaves CDNs
  # on the 5-minute browser lifetime.
  variant_cdn_max_age: 1h

cache:
  # Random-link candidates and variant lookups are cached here. Set a Redis
  # URL (redis://[:password@]host:6379/0, or rediss:// for TLS) to share the
  # cache between instances; empty keeps it in this process's memory.
  redis_url: ""

backup:
  # Console and scheduled backups (zip: database dump + this config). Keep it
  # private: archives hold password hashes and deployment secrets.
  dir: data/backup

updates:
  # Let the console ask GitHub whether a newer release exists (Site settings >
  # About). Set false on servers that must not call out.
  check: true

security:
  # Empty is sufficient for local-only storage. For S3, inject a base64 32-byte
  # key through IMGNEST_SECURITY_MASTER_KEY and preserve it with private backups.
  master_key: ""

database:
  driver: sqlite
  dsn: data/imgnest.db
  max_open: 1
  max_idle: 1
  max_lifetime: 0s
  busy_timeout: 5000ms

# SQLite connections enable WAL and foreign keys in the database layer.
# PostgreSQL defaults: max_open=25, max_idle=10, max_lifetime=5m.
# To select PostgreSQL, supply its driver and DSN. Remove the SQLite pool
# values above if you want the PostgreSQL pool defaults to apply.
