openapi: 3.0.3
info:
  title: ImgNest Native API
  version: M3
  description: |
    Account, token, and image API. Every API response uses the native
    `{code, message, data}` envelope. Success has code 0 and message `ok`;
    failures have a nonzero business code and data `null`.
    Response timestamps are UTC RFC3339. Passwords, credential hashes,
    and token hashes are never returned. Plaintext tokens are returned
    only by login and token creation.
    JSON request bodies are limited to 64 KiB. Malformed JSON, additional
    fields, multiple JSON values, and trailing non-whitespace data are
    rejected with HTTP 400 and code 10001.
    Image bodies at /i and /t use binary responses instead of this envelope.
servers:
  - url: /
    description: Current ImgNest origin
tags:
  - name: Health
  - name: Site
  - name: Authentication
  - name: Tokens
  - name: Images
  - name: Albums
  - name: Gallery
  - name: Policies
  - name: Trash
  - name: Lsky v1
  - name: Admin
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check application and database health
      security: []
      responses:
        '200':
          description: Application and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          $ref: '#/components/responses/InternalError'
  /api/site:
    get:
      operationId: getSite
      tags: [Site]
      summary: Read the public site descriptor
      description: |
        Public endpoint without authentication. It returns only the site name
        and the registration switch; no other settings keys are exposed.
        The site name defaults to `ImgNest` until a configured name exists.
      security: []
      responses:
        '200':
          description: Public site descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/policies:
    get:
      operationId: listPolicies
      tags: [Policies]
      summary: List the rules the authenticated user may upload through
      description: |
        Returns the enabled rules bound to the authenticated user's group whose
        storage backend is enabled, ordered by ID — the same grant semantics
        the upload endpoint enforces, so every listed rule is acceptable to
        upload. A group without eligible bindings yields data `[]`, never null.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permitted rules for the upload-page selector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/captcha:
    get:
      operationId: getPublicCaptcha
      tags: [Authentication]
      summary: Read the active native authentication challenge configuration
      description: |
        Public and read-only. Returns exactly enabled, provider, site_key, and
        version. Disabled configurations expose empty provider and site_key;
        drafts, hostnames, secrets, and encrypted values are never returned.
        A read failure is unavailable, never an implicit disabled configuration.
      security: []
      responses:
        '200':
          description: Active public configuration; absent settings default to disabled/version 0.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaptchaPublicEnvelope'}
        '503':
          $ref: '#/components/responses/CaptchaUnavailable'
  /api/admin/captcha:
    get:
      operationId: getAdminCaptcha
      tags: [Admin]
      summary: Read safe active and draft CAPTCHA configuration
      description: |
        Requires an enabled administrator, checked by both HTTP and service.
        Neither plaintext nor encrypted secrets are returned. A configured secret
        is indicated only by secret_configured. The existing general settings
        endpoint does not expose or modify this configuration.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/CaptchaAdmin'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/CaptchaUnavailable'
  /api/admin/captcha/draft:
    put:
      operationId: saveCaptchaDraft
      tags: [Admin]
      summary: Save a candidate without changing active protection
      description: |
        The whole settings snapshot is persisted using atomic compare-and-swap.
        Every successful mutation increments version; use the latest top-level
        version as expected_version. Saving invalidates both candidate tests.
        Only Turnstile is supported. Known official test keys are rejected.
        Omit secret to reuse the same provider's draft secret, or its active
        secret if no draft exists. Empty secret is invalid. clear_secret=true
        requires disabled protection and an omitted secret; it also discards
        the retained active configuration. A new provider cannot reuse a secret.
        Configuration requires the deployment's existing AES-GCM master key.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptchaDraftRequest'}
      responses:
        '200':
          $ref: '#/components/responses/CaptchaAdmin'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CaptchaConflict'
        '503':
          $ref: '#/components/responses/CaptchaUnavailable'
  /api/admin/captcha/test:
    post:
      operationId: testCaptchaDraft
      tags: [Admin]
      summary: Verify one candidate challenge before activation
      description: |
        Consumes a fresh provider token for action login or register. The returned
        hostname must exactly match a configured hostname. Each successful test
        is bound to the unchanged draft and expires after 15 minutes; both actions
        must be tested. A concurrent draft edit cannot inherit an in-flight test.
        Limited to three requests per minute per client IP before provider calls.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptchaTestRequest'}
      responses:
        '200':
          $ref: '#/components/responses/CaptchaAdmin'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CaptchaConflictOrNotReady'
        '422':
          $ref: '#/components/responses/CaptchaFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CaptchaUnavailable'
  /api/admin/captcha/activation:
    post:
      operationId: setCaptchaActivation
      tags: [Admin]
      summary: Atomically activate a tested candidate or disable protection
      description: |
        Enabling requires fresh successful login and register candidate tests,
        a usable master key, and both compatibility acknowledgements. The first
        acknowledges that unchanged legacy web cannot log in while protection is
        enabled. The second acknowledges that /api/v1/tokens still accepts
        passwords without CAPTCHA. No header or frontend parameter bypasses
        native verification. Disabling requires the current version and admin
        authentication; it retains configuration and existing sessions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptchaActivationRequest'}
      responses:
        '200':
          $ref: '#/components/responses/CaptchaAdmin'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CaptchaConflictOrNotReady'
        '503':
          $ref: '#/components/responses/CaptchaUnavailable'
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      summary: Register an ordinary user
      description: |
        Registration must be enabled by the site administrator. The server
        assigns role `user` and the default group; clients cannot set role,
        group_id, or other account attributes. Limited to three requests
        per minute per client IP, independently of the login limit. The rate
        limit runs before provider verification. When CAPTCHA is enabled,
        captcha_token must pass the active provider for action register before
        account creation. Closed registration does not consume a provider token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created. No token is issued by registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/RegistrationDisabled'
        '409':
          $ref: '#/components/responses/UserExists'
        '422':
          $ref: '#/components/responses/CaptchaFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/CaptchaUnavailable'
  /api/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Log in and issue a web token
      description: |
        A successful login issues a web token that expires in 24 hours.
        Copy the token from this response; it cannot be retrieved later.
        Limited to three requests per minute per client IP, independently
        of the registration limit. Disabled users cannot log in. The rate limit
        runs before provider verification. When CAPTCHA is enabled, captcha_token
        must pass the active provider for action login before password checking
        and token issuance. Failure never falls back to password-only login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted and web token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/CaptchaFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/CaptchaUnavailable'
  /api/auth/sso/exchange:
    post:
      operationId: exchangeSsoTicket
      tags: [Authentication]
      summary: Trade a single sign-on ticket for a web token
      description: |
        A server extension that finishes an external sign-in redirects the
        browser to /auth/sso#ticket=... The web app posts that ticket here.
        A ticket is valid for two minutes and works once. Limited to three
        requests per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoExchangeRequest'
      responses:
        '200':
          description: Ticket accepted and web token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enabled user associated with the bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/profile:
    patch:
      operationId: updateProfile
      tags: [Authentication]
      summary: Update the authenticated user's display name
      description: |
        The user is always taken from the bearer token; the body accepts only
        `display_name`. Surrounding whitespace is trimmed server-side, an
        empty value clears the custom name so clients fall back to the
        username, and at most 64 Unicode characters are stored. Rejected with
        400 for unknown fields, control characters, or an overlong name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: The refreshed user view with recomputed avatar fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the current bearer token
      description: Other tokens belonging to the user remain active.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current token revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password:
    patch:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the password and revoke all user tokens
      description: |
        Requires the current password. A successful change revokes every
        token owned by the user, including the token used for this request.
        Log in again with the new password to obtain a new web token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '200':
          description: Password changed and all tokens revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: |
            Code 20001 means the bearer token is missing or invalid.
            Code 20002 means the current password is incorrect.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code:
                        type: integer
                        enum: [20001, 20002]
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tokens:
    get:
      operationId: listTokens
      tags: [Tokens]
      summary: List the authenticated user's token metadata
      description: |
        Returns an array of TokenView objects. An empty list has data `[]`.
        The plaintext secret and token hash are never included.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token metadata owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createToken
      tags: [Tokens]
      summary: Create an API token
      description: |
        The server assigns kind `api` and abilities `["*"]`. These fields
        cannot be provided by clients in M1. The expiry may be omitted or
        null for an API token without an expiry; otherwise it must be later
        than the current time. The plaintext token is returned only once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: API token created, with plaintext and safe metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedTokenEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [Tokens]
      summary: Revoke an owned token
      description: |
        A token belonging to another user and a nonexistent token both
        return 403 with code 20003 to avoid disclosing token ownership.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Positive signed BIGINT token identifier.
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Owned token revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/upload:
    post:
      operationId: uploadImages
      tags: [Images]
      summary: Upload one or more images with independent compensation
      description: |
        Requires a valid bearer token. Authentication and default-group upload
        preflight happen before the request body is read. Multipart parts are
        read into bounded memory; source images are never spooled to temporary
        files. Metadata fields may occur before or after file parts, but may
        not be repeated. Unknown fields are rejected. The selected policy is
        checked again before processing. Real image format is detected from
        bytes by the shared image service, not from filenames or Content-Type.
        Defaults: 64 MiB total request, at most 20 files, two concurrent upload
        requests, five-minute request deadline. Group and deployment file caps
        also apply. File-level failures do not roll back successful siblings.
        A single file returns its ImageView with HTTP 201 or a normal error;
        multiple files return HTTP 207 with one result per file, in input order.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [file]
                - required: ['files[]']
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, format: binary}
                  description: Repeat the file part for multiple images; file or files[] is required.
                'files[]':
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, format: binary}
                  description: Alternative repeatable file-part name.
                policy_id:
                  $ref: '#/components/schemas/ID'
                album_id:
                  $ref: '#/components/schemas/ID'
                is_public:
                  type: boolean
                  default: false
                  description: Multipart text must be exactly true or false.
      responses:
        '201':
          description: One image committed, including all declared variants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        '207':
          description: Per-file results; inspect every item's status and code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        '413':
          description: Request or file exceeds its byte limit; code 10002.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '408':
          description: Request canceled or upload deadline exceeded; code 10004.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images:
    get:
      operationId: listImages
      tags: [Images]
      summary: List the authenticated user's active images
      description: |
        The optional `album_id` filter differs from the v1 quirk: an absent
        parameter means every image regardless of album, an explicit `0`
        selects only unassigned images, and a positive value selects the
        images of that album after verifying the album belongs to the caller
        (a foreign album answers 403/20003, a missing one 404/10001). The
        `keyword`, `order`, `min_size`/`max_size`, `from`/`to` and `exif`
        parameters narrow the same owner-scoped page; inverted size bounds or
        time windows answer 400/10001.
        With `qv=1`, `q` (including an empty string) and a valid IANA `tz`
        are required. The query uses the unified-search v1.1 grammar; old
        filtering parameters cannot be mixed into this mode. The server
        resolves authorized album names, validates the complete query, applies
        every predicate before counting/pagination, and returns `data.search`.
        Ordinary terms match the original displayed filename only; camera,
        format, visibility, album, size, date and sorting use explicit fields.
        Dates refer to upload created_at with inclusive after and exclusive
        before boundaries. Unsupported versions or invalid mixed protocols
        never silently fall back to the legacy search.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
        - $ref: '#/components/parameters/ImageAlbumFilter'
        - $ref: '#/components/parameters/ImageUnifiedSearch'
        - $ref: '#/components/parameters/ImageQueryVersion'
        - $ref: '#/components/parameters/ImageQueryTimezone'
        - $ref: '#/components/parameters/ImageKeywordFilter'
        - $ref: '#/components/parameters/ImageOrder'
        - $ref: '#/components/parameters/ImageMinSize'
        - $ref: '#/components/parameters/ImageMaxSize'
        - $ref: '#/components/parameters/ImageFromTime'
        - $ref: '#/components/parameters/ImageToTime'
        - $ref: '#/components/parameters/ImageExifFilter'
      responses:
        '200':
          description: Image page without EXIF, source IP, or storage credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        '400':
          $ref: '#/components/responses/SearchInvalid'
        '422':
          $ref: '#/components/responses/SearchAlbumUnavailable'
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/{id}:
    parameters:
      - $ref: '#/components/parameters/ImageID'
    get:
      operationId: getImage
      tags: [Images]
      summary: Read an owner-authorized image
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Image metadata without EXIF.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    patch:
      operationId: setImageVisibility
      tags: [Images]
      summary: Change public-list visibility
      description: Private images remain accessible to anyone holding their direct object link.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [is_public]
              properties:
                is_public: {type: boolean}
      responses:
        '200':
          description: Updated image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    delete:
      operationId: trashImage
      tags: [Images]
      summary: Move an image into the recycle bin
      description: Successful completion removes the original keys from the origin; CDN cache purging is outside this contract.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Image moved to trash; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/{id}/exif:
    get:
      operationId: getImageExif
      tags: [Images]
      summary: Read full owner/admin metadata, including GPS
      description: This authenticated endpoint is the only image API returning GPS and raw metadata.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImageID'
      responses:
        '200':
          description: Private metadata; response is not cached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageExifEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/batch:
    post:
      operationId: batchImages
      tags: [Images]
      summary: Delete images or change their visibility individually
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, ids]
              properties:
                action: {type: string, enum: [delete, permission, album]}
                ids: {$ref: '#/components/schemas/ImageIDs'}
                is_public:
                  type: boolean
                  description: Required for permission; must be omitted for delete and album.
                album_id:
                  type: integer
                  format: int64
                  minimum: 0
                  description: |
                    Album action only — a positive value moves every image into
                    that owned album (foreign 403/20003, missing 404/10001 per
                    item) and zero moves them out of any album. Must be omitted
                    or zero for delete and permission.
      responses:
        '207':
          description: Per-ID status, preserving the requested ID order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash:
    get:
      operationId: listTrash
      tags: [Trash]
      summary: List the authenticated user's recycle bin
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
      responses:
        '200':
          description: Recycle-bin page with retained local thumbnail references.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash/restore:
    post:
      operationId: restoreImages
      tags: [Trash]
      summary: Restore selected images to their original paths
      description: Authorization and current capacity are rechecked before activation.
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/ImageSelection'
      responses:
        '207':
          description: Per-ID restore results; successful data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash/purge:
    post:
      operationId: purgeImages
      tags: [Trash]
      summary: Permanently remove selected trashed images
      description: Removes owned object history and deletion markers before releasing the image path reservation.
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/ImageSelection'
      responses:
        '207':
          description: Per-ID purge results; successful data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/albums:
    get:
      operationId: listAlbums
      tags: [Albums]
      summary: Page the authenticated user's albums with live image counts
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
        - name: keyword
          in: query
          description: Case-insensitive substring match against album name or intro.
          schema: {type: string}
      responses:
        '200':
          description: Album page; image_count is recomputed from active images on every read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumPageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    post:
      operationId: createAlbum
      tags: [Albums]
      summary: Create one owned album
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlbumInput'}
      responses:
        '201':
          description: Album created; the returned view carries a zero image_count.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/albums/suggestions:
    get:
      operationId: suggestSearchAlbums
      tags: [Albums]
      summary: Suggest albums within the caller's authorized search scope
      security: [{bearerAuth: []}]
      description: |
        Returns only string IDs, names and a hasMore flag. Suggestions do not
        replace exact server-side name resolution when executing a search.
        An optional scope_album_id restricts suggestions to one owner-verified
        album, matching the fixed boundary of the album-detail image list.
      parameters:
        - {name: keyword, in: query, schema: {type: string, maxLength: 200}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
        - {name: scope_album_id, in: query, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
      responses:
        '200':
          description: Stable authorized album suggestions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumSuggestionsEnvelope'}
        '400':
          $ref: '#/components/responses/SearchInvalid'
        '422':
          $ref: '#/components/responses/SearchAlbumUnavailable'
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/albums/{id}/images:
    get:
      operationId: searchAlbumImages
      tags: [Images, Albums]
      summary: Search inside one fixed owner-verified album
      description: |
        Requires unified-search qv=1. The path album is a fixed server-enforced
        boundary independent of q, and cannot be removed by clearing or
        changing the query. Unknown and inaccessible albums share the same
        ALBUM_NOT_AVAILABLE diagnostic. Query album conditions may only narrow
        this boundary and never select images outside it.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
        - $ref: '#/components/parameters/ImageQueryVersion'
        - $ref: '#/components/parameters/ImageUnifiedSearch'
        - $ref: '#/components/parameters/ImageQueryTimezone'
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
      responses:
        '200':
          description: Search result within the fixed album, including search metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        '400':
          $ref: '#/components/responses/SearchInvalid'
        '422':
          $ref: '#/components/responses/SearchAlbumUnavailable'
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/albums/{id}:
    parameters:
      - $ref: '#/components/parameters/AlbumID'
    patch:
      operationId: updateAlbum
      tags: [Albums]
      summary: Partially update one owned album
      description: |
        Only the provided fields change. An existing album owned by another
        account answers 403/20003 and a missing one 404/10001, mirroring the
        image endpoints. A zero cover_image_id clears the cover.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlbumPatch'}
      responses:
        '200':
          description: Updated album with a freshly counted view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    delete:
      operationId: deleteAlbum
      tags: [Albums]
      summary: Delete one owned album; its images stay and become unassigned
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Album removed; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/albums/{id}/random-link:
    parameters:
      - $ref: '#/components/parameters/AlbumID'
    get:
      operationId: getAlbumRandomLink
      tags: [Albums]
      summary: Read one owned album's random image link
      description: |
        `data` is null while the album has no link. An album owned by another
        account answers 403/20003 and a missing one 404/10001, like the other
        album endpoints.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The album's link, or null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullableRandomLinkEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    put:
      operationId: putAlbumRandomLink
      tags: [Albums]
      summary: Create the album's random image link or switch it on or off
      description: |
        The first call generates the token. Later calls only change `enabled`;
        the token and therefore the published URL stay the same. Every active
        image in the album, private ones included, becomes reachable through
        the link while it is enabled.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RandomLinkInput'}
      responses:
        '200':
          description: The current link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RandomLinkEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    delete:
      operationId: deleteAlbumRandomLink
      tags: [Albums]
      summary: Delete the album's random image link
      description: Idempotent; deleting a missing link also answers 200.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Link removed; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/albums/{id}/random-link/reset:
    parameters:
      - $ref: '#/components/parameters/AlbumID'
    post:
      operationId: resetAlbumRandomLink
      tags: [Albums]
      summary: Replace the link's token so every shared URL stops resolving
      description: Answers 404/10001 while the album has no link.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The link with its new path.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RandomLinkEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /random/{uid}/{token}:
    parameters:
      - name: uid
        in: path
        required: true
        description: The owner's random public ID.
        schema: {type: string, pattern: '^[0-9A-Za-z]{10}$'}
      - name: token
        in: path
        required: true
        description: The album link's token.
        schema: {type: string, pattern: '^[0-9A-Za-z]{24}$'}
      - name: format
        in: query
        required: false
        description: Omit for WebP (falling back to the original when an image has none); `original` asks for the original.
        schema: {type: string, enum: [original]}
    get:
      operationId: redirectRandomImage
      tags: [Images]
      summary: Redirect to a random active image of the linked album
      description: |
        Public endpoint without authentication, limited to 600 requests per
        minute per client address. Every response carries
        `Cache-Control: no-store`. An unknown or malformed uid or token, a
        disabled link, a disabled owner and an album without usable images all
        answer the same 404/10001. No image metadata or EXIF is returned.
      security: []
      responses:
        '307':
          description: Location is the chosen image's direct link.
          headers:
            Location: {schema: {type: string}}
        '400':
          description: Unsupported `format` value (10001).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    head:
      operationId: headRandomImage
      tags: [Images]
      summary: Same redirect without a body
      security: []
      responses:
        '307':
          description: Location is the chosen image's direct link.
          headers:
            Location: {schema: {type: string}}
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/gallery:
    get:
      operationId: listGallery
      tags: [Gallery]
      summary: Page the public gallery anonymously
      description: |
        Public endpoint without authentication. It serves only active images
        marked public, newest first, each with the uploader's username (the
        seeded guest anchor appears as `guest`). When the site switch
        `gallery_enabled` is closed — or its setting cannot be read — the
        endpoint answers the same well-formed empty page so switch state
        cannot be probed. Images of disabled accounts are hidden. With
        `gallery_public_albums_only` on, only images inside public albums
        are listed. Responses never contain EXIF, GPS, IP addresses,
        or email addresses.
      security: []
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
      responses:
        '200':
          description: Gallery page; possibly empty while the gallery is closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GalleryPageEnvelope'}
        '500':
          $ref: '#/components/responses/InternalError'
  /i/{storageID}/{key}:
    parameters:
      - name: storageID
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      - name: key
        in: path
        required: true
        description: Canonical object key, possibly containing slash-separated path segments, with its extension.
        schema: {type: string}
    get:
      operationId: getLocalImageObject
      tags: [Images]
      summary: Read an active local object using its direct link
      description: Private display visibility does not restrict direct links. Pending, deleted, and undeclared objects return 404.
      security: []
      responses:
        '200':
          description: Raw image bytes with Content-Length and the detected image MIME type.
          content:
            image/*:
              schema: {type: string, format: binary}
        '302':
          description: Requested WebP was skipped; Location points to the stored original.
          headers:
            Location: {schema: {type: string}}
        default:
          $ref: '#/components/responses/ImageFailure'
    head:
      operationId: headLocalImageObject
      tags: [Images]
      summary: Read local-object headers without its body
      security: []
      responses:
        '200': {description: Image headers without bytes.}
        '302': {description: WebP fallback redirect.}
        default:
          $ref: '#/components/responses/ImageFailure'
  /t/{key}.webp:
    parameters:
      - name: key
        in: path
        required: true
        description: Stable opaque image key, excluding the .webp suffix.
        schema: {type: string}
    get:
      operationId: getImageThumbnail
      tags: [Images]
      summary: Read or lazily refill the local thumbnail cache
      description: Public thumbnails allow anonymous requests. Private thumbnails require the owner or an administrator. A supplied invalid Bearer token is rejected.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Raw WebP thumbnail, without metadata.
          content:
            image/webp:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/ImageFailure'
    head:
      operationId: headImageThumbnail
      tags: [Images]
      summary: Read authorized thumbnail headers without its body
      security:
        - {}
        - bearerAuth: []
      responses:
        '200': {description: Thumbnail headers without bytes.}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/v1/tokens:
    post:
      operationId: v1CreateToken
      tags: [Lsky v1]
      summary: Exchange account credentials for an API token
      description: |
        Lsky Pro compatible token endpoint. The credentials may arrive as a
        JSON object or a form body. Issuance is throttled to three attempts
        per client address per minute (IPv6 clients per /64); the fourth
        attempt within a window is rejected with 429. Because this route
        cannot carry the native captcha, an account is also paused with 429
        after ten wrong passwords within fifteen minutes, from any address.
        Wrong credentials stay a business failure (HTTP 200
        with `status: false`) so existing clients only branch on `status`.
        The returned plaintext token is shown exactly once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LskyCredentials'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/LskyCredentials'}
      responses:
        '200':
          description: Issued token, or the wrong-credentials failure envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyTokenEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '403':
          $ref: '#/components/responses/LskyDisabled'
        '429':
          $ref: '#/components/responses/LskyThrottled'
    delete:
      operationId: v1RevokeTokens
      tags: [Lsky v1]
      summary: Revoke every token of the authenticated account
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All API and web tokens of the account are revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyNullEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/strategies:
    get:
      operationId: v1ListStrategies
      tags: [Lsky v1]
      summary: List the upload strategies available to the caller
      description: |
        Returns the enabled rules bound to the caller's group, ordered by ID —
        the same grants the upload endpoint enforces. Without a token the list
        describes the guest group and stays empty unless guest uploads are
        enabled. A bearer token that fails authentication is rejected; it is
        never downgraded to guest access.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Strategy list; empty but never null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyStrategiesEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/upload:
    post:
      operationId: v1Upload
      tags: [Lsky v1]
      summary: Upload one image (Lsky compatible multipart)
      description: |
        Works with a bearer token or, when the administrator enabled guest
        uploads, anonymously. A present but invalid Authorization header is
        always rejected with 401 — it never falls back to guest access.
        The multipart body carries exactly one `file` part plus the optional
        `strategy_id`, `album_id` and `permission` (1 public, 0 private)
        fields. Format detection uses the file header, never the extension,
        and SVG is refused. Business failures (quota, disallowed format,
        oversized file, unknown strategy) stay HTTP 200 with `status: false`.
        `size` is kilobytes as a float; `pathname` is the stored path plus
        file name; `links.url` follows the rule's `link_prefer`. EXIF and GPS
        never appear in the response.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: Exactly one image part.}
                strategy_id: {type: string, description: Numeric rule ID; the group default when absent.}
                album_id: {type: string, description: Numeric album ID. Guests cannot use albums.}
                permission: {type: string, enum: ['0', '1'], description: 1 public, 0 private; private when absent.}
      responses:
        '200':
          description: Upload result, or the business-failure envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyUploadEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
        '429':
          $ref: '#/components/responses/LskyThrottled'
  /api/v1/images:
    get:
      operationId: v1ListImages
      tags: [Lsky v1]
      summary: Page the authenticated account's images
      description: |
        Lsky paginator semantics: 40 items per page and the full Laravel
        field set. The Lsky quirk stands — a missing or zero `album_id`
        selects only images that are not assigned to any album; a non-zero
        value lists that album and attaches its `{id, name}` to every item.
        Items never carry EXIF or GPS.
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: order
          in: query
          schema: {type: string, enum: [newest, earliest, utmost, least], default: newest, description: utmost sorts by size descending.}
        - name: permission
          in: query
          schema: {type: string, enum: [all, public, private], default: all}
        - name: album_id
          in: query
          schema: {type: integer, minimum: 0, description: Zero or absent selects unassigned images.}
        - name: keyword
          in: query
          schema: {type: string, description: Literal substring match on the original or stored file name.}
      responses:
        '200':
          description: Laravel-shaped image page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyImagePageEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/images/{key}:
    delete:
      operationId: v1DeleteImage
      tags: [Lsky v1]
      summary: Move one owned image into the recycle bin
      description: |
        The public URL stops resolving immediately; the objects themselves are
        purged after the retention window. Unknown keys and foreign images are
        business failures with `status: false`, not HTTP errors.
      security: [{bearerAuth: []}]
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Deletion accepted or rejected; clients branch on `status`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyNullEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/albums:
    get:
      operationId: v1ListAlbums
      tags: [Lsky v1]
      summary: Page the authenticated account's albums
      description: 40 items per page; `image_num` always reflects the live number of active images.
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: order
          in: query
          schema: {type: string, enum: [newest, earliest, most, least], default: newest, description: most/least sort by image count.}
        - name: keyword
          in: query
          schema: {type: string, description: Literal substring match on name or intro.}
      responses:
        '200':
          description: Laravel-shaped album page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyAlbumPageEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/albums/{id}:
    delete:
      operationId: v1DeleteAlbum
      tags: [Lsky v1]
      summary: Delete one owned album; its images stay
      description: The images themselves are kept and their album reference is cleared, so they reappear as unassigned.
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Deletion accepted or rejected; clients branch on `status`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyMessageEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/profile:
    get:
      operationId: v1GetProfile
      tags: [Lsky v1]
      summary: Read the authenticated account's profile and capacity
      description: '`capacity` and `used_capacity` are kilobytes as floats; a group without a byte limit reports capacity 0.'
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Account profile in the Lsky field set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyProfileEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/admin/users:
    post:
      operationId: adminCreateUser
      tags: [Admin]
      summary: Create an account with an initial password
      description: |
        Administrator-only creation is independent of the public registration
        switch. The initial password follows the existing 12–72 UTF-8 byte
        policy and is stored only as a bcrypt hash. No password, hash or token
        is returned. The group must be an existing non-guest group. Username
        and normalized email remain unique; display_name is optional and
        non-unique. No invitation or activation email is sent.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserCreate'}
      responses:
        '201':
          description: The created safe account view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username or email already exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: adminListUsers
      tags: [Admin]
      summary: List every account with pagination and an optional keyword
      description: |
        Requires the administrator role; any other authenticated caller is
        rejected with 403/code 20003. The never-authenticating guest anchor
        row is not a manageable account and never appears. `keyword` matches
        substring-wise against username and email.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImagePageNumber'}
        - {$ref: '#/components/parameters/ImagePageSize'}
        - {name: keyword, in: query, schema: {type: string}}
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPageEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}:
    patch:
      operationId: adminPatchUser
      tags: [Admin]
      summary: Edit an account's identity, profile, role, status or group
      description: |
        Requires the administrator role and only changes explicitly provided
        fields. Effective username, email, role, status or group changes revoke
        all of the account's bearer credentials atomically. Display-name-only
        edits and unchanged values preserve sessions. An administrator cannot
        disable their own account; concurrent changes cannot disable or demote
        the last enabled administrator. group_id must name a non-guest group.
        Username and normalized email remain unique. Password changes are not
        accepted here; used_bytes, IDs, avatar settings and timestamps are also
        server-owned. Self-service username/email remain read-only.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserPatch'}
      responses:
        '200':
          description: The updated account view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username or email already exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/groups:
    get:
      operationId: adminListGroups
      tags: [Admin]
      summary: List every group with member counts and rule bindings
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All groups in database ID order; the array is never null.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/GroupView'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: adminCreateGroup
      tags: [Admin]
      summary: Create a group
      description: |
        Requires the administrator role. The default and guest roles are
        structural: at most one group of each kind may exist and the flags
        are fixed at creation. `default_policy_id` must be part of
        `policy_ids`; every bound rule must exist.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupInput'}
      responses:
        '201':
          description: The created group view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/groups/{id}:
    patch:
      operationId: adminPatchGroup
      tags: [Admin]
      summary: Change a group's quotas or rule bindings
      description: |
        Requires the administrator role. Only the supplied fields change. The
        default/guest flags have no request shape. A nonzero
        `default_policy_id` must stay inside the resulting `policy_ids`.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupPatch'}
      responses:
        '200':
          description: The updated group view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminDeleteGroup
      tags: [Admin]
      summary: Delete an empty, unreferenced, non-structural group
      description: |
        Requires the administrator role. The default and guest groups are
        protected (403/20003). A group with members returns 409/30008; a
        group a settings key still points at returns 409/30009. Deletion
        never cascades to accounts.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Group deleted; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GroupHasMembers'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/storages:
    get:
      operationId: adminListStorages
      tags: [Admin]
      summary: List every storage backend without any configuration
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All backends in database ID order; no config or secret is ever included.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/StorageView'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: adminCreateStorage
      tags: [Admin]
      summary: Create and connectivity-test a storage backend
      description: |
        Requires the administrator role. Uses the same provisioning path as
        the host setup command: S3 configurations are sealed with the
        deployment master key before persistence and the backend must pass a
        put/copy/delete probe. The response never contains the configuration.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageInput'}
      responses:
        '201':
          description: The created backend view without configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/storages/{id}:
    patch:
      operationId: adminPatchStorage
      tags: [Admin]
      summary: Change a backend's name, base URL, switch, or configuration
      description: |
        Requires the administrator role. A supplied `config` replaces the
        stored configuration wholesale (re-sealed for S3) and must pass the
        connectivity probe before the change is persisted. Once any image
        lives on the backend, a `config` that changes where objects are kept
        (local `root`; S3 `endpoint`, `region` or `bucket`) returns 409/30009;
        credentials and path style may still change. The configuration is
        never part of any response.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoragePatch'}
      responses:
        '200':
          description: The updated backend view without configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StillReferenced'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminDeleteStorage
      tags: [Admin]
      summary: Delete a backend no rule references
      description: |
        Requires the administrator role. Backends still referenced by any
        upload rule return 409/30009; references are re-checked inside the
        deleting transaction.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Storage deleted; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StillReferenced'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/storages/{id}/test:
    post:
      operationId: adminTestStorage
      tags: [Admin]
      summary: Run the put/copy/delete connectivity probe
      description: |
        Requires the administrator role. Writes, copies, and deletes private
        probe objects only; no user data is touched. Each capability is
        reported separately and probe objects are always cleaned up.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Per-check probe results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageTestEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/policies:
    get:
      operationId: adminListPolicies
      tags: [Admin]
      summary: List every upload rule
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All rules in database ID order; the array is never null.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/PolicyView'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: adminCreatePolicy
      tags: [Admin]
      summary: Create an upload rule from documented defaults plus overrides
      description: |
        Requires the administrator role. `name` and `storage_id` are required;
        every other field falls back to the documented conservative defaults.
        Path templates are validated before persistence. Rules are created
        unbound and become usable once a group binds them.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyInput'}
      responses:
        '201':
          description: The created rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/policies/preview:
    post:
      operationId: adminPreviewPolicy
      tags: [Admin]
      summary: Render one sample path for path/name templates
      description: |
        Requires the administrator role. The sample uses the current time,
        the caller's account ID, the filename `example.jpg`, and fixed
        example content digests. Template failures return HTTP 200 with a
        non-empty `error` and an empty `sample`; the diagnostic is a static
        template message.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyPreviewRequest'}
      responses:
        '200':
          description: Sample path or template diagnostic.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyPreviewEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /api/admin/policies/{id}:
    patch:
      operationId: adminPatchPolicy
      tags: [Admin]
      summary: Change rule fields
      description: |
        Requires the administrator role. Only the supplied fields change and
        the final state is validated exactly like creation, including the
        path templates and the enabled storage backend.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyPatch'}
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminDeletePolicy
      tags: [Admin]
      summary: Delete an unreferenced rule
      description: |
        Requires the administrator role. Rules still referenced by images or
        as a group's default return 409/30009.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Rule deleted; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StillReferenced'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/settings:
    get:
      operationId: adminGetSettings
      tags: [Admin]
      summary: Read the full site configuration
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All nine settings with documented defaults for unset keys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: adminPutSettings
      tags: [Admin]
      summary: Change the supplied settings keys
      description: |
        Requires the administrator role. Partial update: only the fields
        present in the body are written, then the full configuration is
        returned. `site_name` must be 1-100 characters, `trash_days` 0-36500,
        `default_group_id` must name an existing group, and `guest_group_id`
        either 0 or an existing group.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminSettingsPatch'}
      responses:
        '200':
          description: The saved configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/images:
    get:
      operationId: adminListImages
      tags: [Admin]
      summary: List every active image site-wide
      description: |
        Requires the administrator role. Returns the same safe image views as
        the owner listing. `user_id` filters by owner; `keyword` matches the
        original filename or the stored pathname.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImagePageNumber'}
        - {$ref: '#/components/parameters/ImagePageSize'}
        - {name: user_id, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: keyword, in: query, schema: {type: string}}
      responses:
        '200':
          description: One site-wide page of images.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/images/{id}:
    delete:
      operationId: adminDeleteImage
      tags: [Admin]
      summary: Move any owner's image into the recycle bin
      description: |
        Requires the administrator role. The owner-facing pipeline runs
        unchanged: original URLs 404 immediately and physical deletion
        follows the recycle-bin retention.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Image recycled; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ImageBusy'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/trash/purge-all:
    post:
      operationId: adminPurgeAllTrash
      tags: [Admin]
      summary: Physically purge the entire site-wide recycle bin
      description: |
        Requires the administrator role. Every recycled image goes through
        the regular per-image purge path one at a time. When any purge fails
        the response keeps its partial progress visible: HTTP 502/code 50002
        with `data.purged` counting the images that were fully removed.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Every recycled image was purged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrashPurgeEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '502':
          description: Some images could not be purged; data carries the successful count.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code: {type: integer, enum: [50002]}
                      data:
                        type: object
                        additionalProperties: false
                        required: [purged]
                        properties:
                          purged: {type: integer, format: int64, minimum: 0}
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    ImageID:
      name: id
      in: path
      required: true
      description: Authenticated native numeric image identifier.
      schema: {$ref: '#/components/schemas/ID'}
    AlbumID:
      name: id
      in: path
      required: true
      description: Authenticated native numeric album identifier.
      schema: {$ref: '#/components/schemas/ID'}
    ImageAlbumFilter:
      name: album_id
      in: query
      description: Absent means no album filter; 0 selects unassigned images; a positive value selects one owner-verified album.
      schema: {type: integer, format: int64, minimum: 0}
    ImageUnifiedSearch:
      name: q
      in: query
      description: With qv=1, required unified-search grammar input (empty allowed), at most 4096 UTF-8 bytes. Without qv, the legacy filename/path/EXIF OR needle remains limited to 200 bytes.
      schema: {type: string, maxLength: 4096}
    ImageQueryVersion:
      name: qv
      in: query
      description: Explicit query version; only 1 is supported. Omission preserves the legacy API. New-mode page is 1–10000 and size is one of 20, 50, 100.
      schema: {type: integer, enum: [1]}
    ImageQueryTimezone:
      name: tz
      in: query
      description: Required with qv=1; valid IANA time zone used for upload-date boundaries, independent of display language.
      schema: {type: string, example: Asia/Shanghai}
    ImageKeywordFilter:
      name: keyword
      in: query
      description: Case-insensitive substring match on the stored file name (display name or stored path plus extension), up to 200 bytes.
      schema: {type: string, maxLength: 200}
    ImageOrder:
      name: order
      in: query
      description: Sort for the page; the default matches the previous behavior (newest).
      schema: {type: string, enum: [newest, oldest, largest, smallest], default: newest}
    ImageMinSize:
      name: min_size
      in: query
      description: Inclusive lower bound of the stored original size in bytes; absent or 0 means unbounded.
      schema: {type: integer, format: int64, minimum: 0}
    ImageMaxSize:
      name: max_size
      in: query
      description: Inclusive upper bound of the stored original size in bytes; absent or 0 means unbounded.
      schema: {type: integer, format: int64, minimum: 0}
    ImageFromTime:
      name: from
      in: query
      description: Inclusive lower bound of the upload time (RFC3339).
      schema: {type: string, format: date-time}
    ImageToTime:
      name: to
      in: query
      description: Inclusive upper bound of the upload time (RFC3339).
      schema: {type: string, format: date-time}
    ImageExifFilter:
      name: exif
      in: query
      description: Case-insensitive substring match on the stored EXIF make, model or lens (only where metadata exists), up to 200 bytes.
      schema: {type: string, maxLength: 200}
    ImagePageNumber:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    ImagePageSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  requestBodies:
    ImageSelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ids]
            properties:
              ids: {$ref: '#/components/schemas/ImageIDs'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: '<id>|<40 alphanumeric characters>'
      description: |
        Send `Authorization: Bearer <token>`. The token consists of a
        positive signed BIGINT ID, a pipe, and exactly 40 ASCII
        alphanumeric characters. Expired or revoked tokens and tokens
        owned by disabled users are rejected with 401/code 20001.
  schemas:
    CaptchaVersion:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Monotonically increasing snapshot version; safe to represent as a JavaScript integer.
    CaptchaToken:
      type: string
      maxLength: 2048
      writeOnly: true
      description: Single-use provider token; required when native CAPTCHA is enabled. Never retained or echoed.
    CaptchaPublicView:
      type: object
      additionalProperties: false
      required: [enabled, provider, site_key, version]
      properties:
        enabled: {type: boolean}
        provider: {type: string, enum: ['', turnstile]}
        site_key: {type: string}
        version: {$ref: '#/components/schemas/CaptchaVersion'}
    CaptchaConfigView:
      type: object
      nullable: true
      additionalProperties: false
      required: [provider, site_key, hostnames, secret_configured, version]
      properties:
        provider: {type: string, enum: [turnstile]}
        site_key: {type: string}
        hostnames: {type: array, items: {type: string}}
        secret_configured: {type: boolean}
        version: {$ref: '#/components/schemas/CaptchaVersion'}
    CaptchaDraftView:
      type: object
      nullable: true
      additionalProperties: false
      required: [provider, site_key, hostnames, secret_configured, version, tested, tested_actions]
      properties:
        provider: {type: string, enum: [turnstile]}
        site_key: {type: string}
        hostnames: {type: array, items: {type: string}}
        secret_configured: {type: boolean}
        version: {$ref: '#/components/schemas/CaptchaVersion'}
        tested: {type: boolean, description: Both candidate actions passed within the last 15 minutes.}
        tested_actions:
          type: array
          items: {type: string, enum: [login, register]}
          description: Fresh successful actions, in login then register order; empty array if none.
    CaptchaAdminView:
      type: object
      additionalProperties: false
      required: [version, enabled, active, draft, configuration_available]
      properties:
        version: {$ref: '#/components/schemas/CaptchaVersion'}
        enabled: {type: boolean}
        active: {$ref: '#/components/schemas/CaptchaConfigView'}
        draft: {$ref: '#/components/schemas/CaptchaDraftView'}
        configuration_available:
          type: boolean
          description: The deployment has a configured master key; existing secret decryption may still fail.
    CaptchaDraftRequest:
