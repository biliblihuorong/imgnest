openapi: 3.0.3
info:
  title: ImgNest Native API
  version: M2
  description: |
    Account, token, and image API. Every API response uses the native
    `{code, message, data}` envelope. Success has code 0 and message `ok`;
    failures have a nonzero business code and data `null`.
    Response timestamps are UTC RFC3339. Passwords, credential hashes,
    and token hashes are never returned. Plaintext tokens are returned
    only by login and token creation.
    JSON request bodies are limited to 64 KiB. Malformed JSON, additional
    fields, multiple JSON values, and trailing non-whitespace data are
    rejected with HTTP 400 and code 10001.
    Image bodies at /i and /t use binary responses instead of this envelope.
servers:
  - url: /
    description: Current ImgNest origin
tags:
  - name: Health
  - name: Authentication
  - name: Tokens
  - name: Images
  - name: Trash
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check application and database health
      security: []
      responses:
        '200':
          description: Application and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          $ref: '#/components/responses/InternalError'
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      summary: Register an ordinary user
      description: |
        Registration must be enabled by the site administrator. The server
        assigns role `user` and the default group; clients cannot set role,
        group_id, or other account attributes. Limited to three requests
        per minute per client IP, independently of the login limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created. No token is issued by registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/RegistrationDisabled'
        '409':
          $ref: '#/components/responses/UserExists'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Log in and issue a web token
      description: |
        A successful login issues a web token that expires in 24 hours.
        Copy the token from this response; it cannot be retrieved later.
        Limited to three requests per minute per client IP, independently
        of the registration limit. Disabled users cannot log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted and web token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enabled user associated with the bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the current bearer token
      description: Other tokens belonging to the user remain active.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current token revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password:
    patch:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the password and revoke all user tokens
      description: |
        Requires the current password. A successful change revokes every
        token owned by the user, including the token used for this request.
        Log in again with the new password to obtain a new web token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '200':
          description: Password changed and all tokens revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: |
            Code 20001 means the bearer token is missing or invalid.
            Code 20002 means the current password is incorrect.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code:
                        type: integer
                        enum: [20001, 20002]
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tokens:
    get:
      operationId: listTokens
      tags: [Tokens]
      summary: List the authenticated user's token metadata
      description: |
        Returns an array of TokenView objects. An empty list has data `[]`.
        The plaintext secret and token hash are never included.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token metadata owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createToken
      tags: [Tokens]
      summary: Create an API token
      description: |
        The server assigns kind `api` and abilities `["*"]`. These fields
        cannot be provided by clients in M1. The expiry may be omitted or
        null for an API token without an expiry; otherwise it must be later
        than the current time. The plaintext token is returned only once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: API token created, with plaintext and safe metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedTokenEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [Tokens]
      summary: Revoke an owned token
      description: |
        A token belonging to another user and a nonexistent token both
        return 403 with code 20003 to avoid disclosing token ownership.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Positive signed BIGINT token identifier.
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Owned token revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/upload:
    post:
      operationId: uploadImages
      tags: [Images]
      summary: Upload one or more images with independent compensation
      description: |
        Requires a valid bearer token. Authentication and default-group upload
        preflight happen before the request body is read. Multipart parts are
        read into bounded memory; source images are never spooled to temporary
        files. Metadata fields may occur before or after file parts, but may
        not be repeated. Unknown fields are rejected. The selected policy is
        checked again before processing. Real image format is detected from
        bytes by the shared image service, not from filenames or Content-Type.
        Defaults: 64 MiB total request, at most 20 files, two concurrent upload
        requests, five-minute request deadline. Group and deployment file caps
        also apply. File-level failures do not roll back successful siblings.
        A single file returns its ImageView with HTTP 201 or a normal error;
        multiple files return HTTP 207 with one result per file, in input order.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [file]
                - required: ['files[]']
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, format: binary}
                  description: Repeat the file part for multiple images; file or files[] is required.
                'files[]':
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, format: binary}
                  description: Alternative repeatable file-part name.
                policy_id:
                  $ref: '#/components/schemas/ID'
                album_id:
                  $ref: '#/components/schemas/ID'
                is_public:
                  type: boolean
                  default: false
                  description: Multipart text must be exactly true or false.
      responses:
        '201':
          description: One image committed, including all declared variants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        '207':
          description: Per-file results; inspect every item's status and code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        '413':
          description: Request or file exceeds its byte limit; code 10002.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '408':
          description: Request canceled or upload deadline exceeded; code 10004.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images:
    get:
      operationId: listImages
      tags: [Images]
      summary: List the authenticated user's active images
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
      responses:
        '200':
          description: Image page without EXIF, source IP, or storage credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/{id}:
    parameters:
      - $ref: '#/components/parameters/ImageID'
    get:
      operationId: getImage
      tags: [Images]
      summary: Read an owner-authorized image
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Image metadata without EXIF.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    patch:
      operationId: setImageVisibility
      tags: [Images]
      summary: Change public-list visibility
      description: Private images remain accessible to anyone holding their direct object link.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [is_public]
              properties:
                is_public: {type: boolean}
      responses:
        '200':
          description: Updated image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    delete:
      operationId: trashImage
      tags: [Images]
      summary: Move an image into the recycle bin
      description: Successful completion removes the original keys from the origin; CDN cache purging is outside this contract.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Image moved to trash; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/{id}/exif:
    get:
      operationId: getImageExif
      tags: [Images]
      summary: Read full owner/admin metadata, including GPS
      description: This authenticated endpoint is the only image API returning GPS and raw metadata.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImageID'
      responses:
        '200':
          description: Private metadata; response is not cached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageExifEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/batch:
    post:
      operationId: batchImages
      tags: [Images]
      summary: Delete images or change their visibility individually
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, ids]
              properties:
                action: {type: string, enum: [delete, permission]}
                ids: {$ref: '#/components/schemas/ImageIDs'}
                is_public:
                  type: boolean
                  description: Required for permission; must be omitted for delete.
      responses:
        '207':
          description: Per-ID status, preserving the requested ID order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash:
    get:
      operationId: listTrash
      tags: [Trash]
      summary: List the authenticated user's recycle bin
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
      responses:
        '200':
          description: Recycle-bin page with retained local thumbnail references.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash/restore:
    post:
      operationId: restoreImages
      tags: [Trash]
      summary: Restore selected images to their original paths
      description: Authorization and current capacity are rechecked before activation.
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/ImageSelection'
      responses:
        '207':
          description: Per-ID restore results; successful data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash/purge:
    post:
      operationId: purgeImages
      tags: [Trash]
      summary: Permanently remove selected trashed images
      description: Removes owned object history and deletion markers before releasing the image path reservation.
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/ImageSelection'
      responses:
        '207':
          description: Per-ID purge results; successful data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /i/{storageID}/{key}:
    parameters:
      - name: storageID
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      - name: key
        in: path
        required: true
        description: Canonical object key, possibly containing slash-separated path segments, with its extension.
        schema: {type: string}
    get:
      operationId: getLocalImageObject
      tags: [Images]
      summary: Read an active local object using its direct link
      description: Private display visibility does not restrict direct links. Pending, deleted, and undeclared objects return 404.
      security: []
      responses:
        '200':
          description: Raw image bytes with Content-Length and the detected image MIME type.
          content:
            image/*:
              schema: {type: string, format: binary}
        '302':
          description: Requested WebP was skipped; Location points to the stored original.
          headers:
            Location: {schema: {type: string}}
        default:
          $ref: '#/components/responses/ImageFailure'
    head:
      operationId: headLocalImageObject
      tags: [Images]
      summary: Read local-object headers without its body
      security: []
      responses:
        '200': {description: Image headers without bytes.}
        '302': {description: WebP fallback redirect.}
        default:
          $ref: '#/components/responses/ImageFailure'
  /t/{key}.webp:
    parameters:
      - name: key
        in: path
        required: true
        description: Stable opaque image key, excluding the .webp suffix.
        schema: {type: string}
    get:
      operationId: getImageThumbnail
      tags: [Images]
      summary: Read or lazily refill the local thumbnail cache
      description: Public thumbnails allow anonymous requests. Private thumbnails require the owner or an administrator. A supplied invalid Bearer token is rejected.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Raw WebP thumbnail, without metadata.
          content:
            image/webp:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/ImageFailure'
    head:
      operationId: headImageThumbnail
      tags: [Images]
      summary: Read authorized thumbnail headers without its body
      security:
        - {}
        - bearerAuth: []
      responses:
        '200': {description: Thumbnail headers without bytes.}
        default:
          $ref: '#/components/responses/ImageFailure'
components:
  parameters:
    ImageID:
      name: id
      in: path
      required: true
      description: Authenticated native numeric image identifier.
      schema: {$ref: '#/components/schemas/ID'}
    ImagePageNumber:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    ImagePageSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  requestBodies:
    ImageSelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ids]
            properties:
              ids: {$ref: '#/components/schemas/ImageIDs'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: '<id>|<40 alphanumeric characters>'
      description: |
        Send `Authorization: Bearer <token>`. The token consists of a
        positive signed BIGINT ID, a pipe, and exactly 40 ASCII
        alphanumeric characters. Expired or revoked tokens and tokens
        owned by disabled users are rejected with 401/code 20001.
  schemas:
    ImageIDs:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items: {$ref: '#/components/schemas/ID'}
    ImageLinks:
      type: object
      additionalProperties: false
      required: [url, original, webp, thumbnail_url]
      properties:
        url: {type: string, description: Preferred available version.}
        original: {type: string, description: Empty if no original is stored.}
        webp: {type: string, description: Empty if no WebP is stored.}
        thumbnail_url: {type: string, description: Cloud thumbnail URL or an empty string.}
    ImageView:
      type: object
      additionalProperties: false
      description: Safe image metadata; never contains EXIF, GPS, source IP, provider credentials, or operation internals.
      required: [id, key, user_id, album_id, policy_id, storage_id, name, ext, mime, size, webp_size, charged_bytes, width, height, frames, has_original, has_webp, has_thumb, scrubbed, is_public, md5, sha1, src_md5, links, local_thumb_url, deleted_at, purge_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        key: {type: string, description: Stable opaque public image identity.}
        user_id: {$ref: '#/components/schemas/ID'}
        album_id: {type: integer, format: int64, minimum: 0, description: Zero when no album is selected.}
        policy_id: {$ref: '#/components/schemas/ID'}
        storage_id: {$ref: '#/components/schemas/ID'}
        name: {type: string, description: Original client filename; not used for format detection.}
        ext: {type: string}
        mime: {type: string}
        size: {type: integer, format: int64, minimum: 0, description: Stored primary-object bytes.}
        webp_size: {type: integer, format: int64, minimum: 0}
        charged_bytes: {type: integer, format: int64, minimum: 0, description: Unique cloud-object bytes including cloud thumbnail; excludes local cache.}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        frames: {type: integer, minimum: 1}
        has_original: {type: boolean}
        has_webp: {type: boolean}
        has_thumb: {type: boolean}
        scrubbed: {type: boolean}
        is_public: {type: boolean, description: Controls display visibility; direct links remain accessible.}
        md5: {type: string, description: MD5 of the stored primary object's exact bytes.}
        sha1: {type: string, description: SHA-1 of the stored primary object's exact bytes.}
        src_md5: {type: string, description: MD5 of the original uploaded bytes before sanitization.}
        links: {$ref: '#/components/schemas/ImageLinks'}
        local_thumb_url: {type: string}
        deleted_at: {$ref: '#/components/schemas/NullableTimestamp'}
        purge_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ImagePage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ImageView'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    ImageExif:
      type: object
      additionalProperties: false
      required: [image_id, make, model, lens, exposure, f_number, focal_length, iso, orientation, taken_at, gps_lat, gps_lng, gps_alt, raw, created_at, updated_at]
      properties:
        image_id: {$ref: '#/components/schemas/ID'}
        make: {type: string}
        model: {type: string}
        lens: {type: string}
        exposure: {type: string}
        f_number: {type: string}
        focal_length: {type: string}
        iso: {type: integer}
        orientation: {type: integer}
        taken_at: {$ref: '#/components/schemas/NullableTimestamp'}
        gps_lat: {type: number, nullable: true}
        gps_lng: {type: number, nullable: true}
        gps_alt: {type: number, nullable: true}
        raw: {type: object, additionalProperties: true, description: Complete private metadata archive, including original blocks.}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ImageBatchItem:
      type: object
      additionalProperties: false
      required: [status, code, message, data]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        filename: {type: string, description: Present for upload results.}
        status: {type: integer, description: HTTP-equivalent status for this item.}
        code: {type: integer, description: Zero on success; otherwise an application error code.}
        message: {type: string}
        data:
          description: ImageView for successful uploads/visibility updates; null for deletion/restoration/purge or failures.
          oneOf:
            - $ref: '#/components/schemas/ImageView'
            - $ref: '#/components/schemas/NullData'
    ImageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ImageView'}
    ImagePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ImagePage'}
    ImageExifEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ImageExif'}
    ImageBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: {$ref: '#/components/schemas/ImageBatchItem'}
    ID:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
      description: Positive signed BIGINT database identifier, serialized as a JSON number.
      example: 7
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp; fractional seconds may be present.
      example: '2026-10-04T00:00:00Z'
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
      description: UTC RFC3339 timestamp, or null when unset.
      example: null
    Password:
      type: string
      format: password
      writeOnly: true
      description: |
        New password length is 12–72 UTF-8 bytes, not characters or runes.
        Whitespace is part of the password and is not trimmed. The byte
        limits are enforced by the service; OpenAPI minLength/maxLength
        would count characters and therefore are not used here.
      x-min-bytes: 12
      x-max-bytes: 72
    CredentialPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      description: |
        Existing password for login or current-password verification.
        Accepts 1–72 UTF-8 bytes so legacy bcrypt credentials below the
        new-password minimum remain usable. Whitespace is not trimmed.
        The upper limit counts bytes, so maxLength is not used here.
      x-min-bytes: 1
      x-max-bytes: 72
    EmailInput:
      type: string
      description: |
        Plain email address. Surrounding whitespace is trimmed and the
        address is lowercased before validation. Display-name forms such
        as `Name <user@example.com>` are rejected.
      example: user@example.com
    PlaintextToken:
      type: string
      pattern: '^[1-9][0-9]*\|[A-Za-z0-9]{40}$'
      description: |
        Newly issued bearer credential. Its ID is a positive signed BIGINT
        database identifier and its secret is exactly 40 ASCII alphanumeric characters.
        Only login and token creation responses expose this value.
      example: 7|abcdefghijklmnopqrstuvwxyz0123456789ABCD
    NullData:
      type: object
      nullable: true
      enum: [null]
      description: Always the JSON null value.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: Username of 3–64 Unicode code points (Go runes).
          example: imgnest-user
        email:
          $ref: '#/components/schemas/EmailInput'
        password:
          $ref: '#/components/schemas/Password'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/EmailInput'
        password:
          $ref: '#/components/schemas/CredentialPassword'
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          $ref: '#/components/schemas/CredentialPassword'
        new_password:
          $ref: '#/components/schemas/Password'
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Token name; it must contain a non-whitespace character.
          example: blog-client
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional RFC3339 expiry later than the current time. Omitted
            or null means no expiry. Returned timestamps are normalized
            to UTC.
          example: '2026-11-04T00:00:00Z'
    UserView:
      type: object
      additionalProperties: false
      required: [id, group_id, username, email, role, status, used_bytes, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        group_id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [enabled, disabled]
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Storage usage in bytes.
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TokenView:
      type: object
      additionalProperties: false
      required: [id, name, kind, abilities, expires_at, last_used_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        kind:
          type: string
          enum: [web, api]
        abilities:
          type: array
          minItems: 1
          maxItems: 1
          description: M1 supports only the single wildcard ability ["*"].
          items:
            type: string
            enum: ['*']
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_used_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    LoginData:
      type: object
      additionalProperties: false
      required: [token, user, expires_at]
      properties:
        token:
          $ref: '#/components/schemas/PlaintextToken'
        user:
          $ref: '#/components/schemas/UserView'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    IssuedToken:
      type: object
      additionalProperties: false
      required: [token, info]
      properties:
        token:
          $ref: '#/components/schemas/PlaintextToken'
        info:
          $ref: '#/components/schemas/TokenView'
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
          enum: [ok]
        data:
          description: Operation-specific success payload.
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ok]
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserView'
    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginData'
    NullEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NullData'
    TokenListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TokenView'
    IssuedTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/IssuedToken'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [10001, 10002, 10004, 20001, 20002, 20003, 30001, 30002, 30003, 30004, 30005, 30006, 30007, 50001, 50002, 50003]
        message:
          type: string
          description: Human-readable error message without technical or credential details.
        data:
          $ref: '#/components/schemas/NullData'
  responses:
    ImageFailure:
      description: |
        Native error envelope. 400/10001 invalid input; 401/20001 missing or
        revoked authentication; 403/20003 forbidden; 404/10001 missing image;
        413/10002 byte limit; 408/10004 cancellation/deadline; 429/30003 upload
        rate; 403/30004 quota; 409/30005 path conflict; 409/30006 in-progress
        image operation; 415/30007 disallowed format; 502/50002 storage failure;
        422/50003 processing or privacy-sanitization failure; 500/50001 other
        internal failure. No private source data or provider diagnostics are returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InvalidInput:
      description: Invalid JSON, unknown fields, invalid path ID, or invalid input; code 10001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [10001]
    Unauthenticated:
      description: Missing, malformed, expired, revoked, or otherwise invalid bearer token; code 20001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [20001]
    InvalidCredentials:
      description: Incorrect email/password or disabled account; code 20002.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [20002]
    Forbidden:
      description: Token does not belong to the authenticated user or does not exist; code 20003.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [20003]
    RegistrationDisabled:
      description: Site registration is disabled; code 30001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30001]
    UserExists:
      description: Username or email is already registered; code 30002.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30002]
    RateLimited:
      description: More than three registration or login requests per minute from the same client IP; code 30003.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30003]
    InternalError:
      description: Internal operation or database health check failed; code 50001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [50001]
