        frames: {type: integer, minimum: 1}
        links: {$ref: '#/components/schemas/ImageLinks'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        uploader: {type: string, description: Uploader's username; the seeded guest anchor appears as `guest`.}
    GalleryPage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GalleryItem'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    ImageExif:
      type: object
      additionalProperties: false
      required: [image_id, make, model, lens, exposure, f_number, focal_length, iso, orientation, taken_at, gps_lat, gps_lng, gps_alt, raw, created_at, updated_at]
      properties:
        image_id: {$ref: '#/components/schemas/ID'}
        make: {type: string}
        model: {type: string}
        lens: {type: string}
        exposure: {type: string}
        f_number: {type: string}
        focal_length: {type: string}
        iso: {type: integer}
        orientation: {type: integer}
        taken_at: {$ref: '#/components/schemas/NullableTimestamp'}
        gps_lat: {type: number, nullable: true}
        gps_lng: {type: number, nullable: true}
        gps_alt: {type: number, nullable: true}
        raw: {type: object, additionalProperties: true, description: Complete private metadata archive, including original blocks.}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ImageBatchItem:
      type: object
      additionalProperties: false
      required: [status, code, message, data]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        filename: {type: string, description: Present for upload results.}
        status: {type: integer, description: HTTP-equivalent status for this item.}
        code: {type: integer, description: Zero on success; otherwise an application error code.}
        message: {type: string}
        data:
          description: ImageView for successful uploads, visibility, and album moves; null for deletion/restoration/purge or failures.
          oneOf:
            - $ref: '#/components/schemas/ImageView'
            - $ref: '#/components/schemas/NullData'
    ImageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ImageView'}
    ImageExifEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ImageExif'}
    ImageBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: {$ref: '#/components/schemas/ImageBatchItem'}
    AlbumEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AlbumView'}
    RandomLinkView:
      type: object
      additionalProperties: false
      required: [enabled, path, created_at]
      properties:
        enabled: {type: boolean}
        path:
          type: string
          description: Site-relative `/random/{uid}/{token}`; clients prefix their own origin.
        created_at: {type: string, format: date-time}
    RandomLinkInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    RandomLinkEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/RandomLinkView'}
    NullableRandomLinkEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RandomLinkView'
    AlbumPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AlbumPage'}
    GalleryPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/GalleryPage'}
    ID:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
      description: Positive signed BIGINT database identifier, serialized as a JSON number.
      example: 7
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC3339 timestamp; fractional seconds may be present.
      example: '2026-10-04T00:00:00Z'
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
      description: UTC RFC3339 timestamp, or null when unset.
      example: null
    Password:
      type: string
      format: password
      writeOnly: true
      description: |
        New password length is 12–72 UTF-8 bytes, not characters or runes.
        Whitespace is part of the password and is not trimmed. The byte
        limits are enforced by the service; OpenAPI minLength/maxLength
        would count characters and therefore are not used here.
      x-min-bytes: 12
      x-max-bytes: 72
    CredentialPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      description: |
        Existing password for login or current-password verification.
        Accepts 1–72 UTF-8 bytes so legacy bcrypt credentials below the
        new-password minimum remain usable. Whitespace is not trimmed.
        The upper limit counts bytes, so maxLength is not used here.
      x-min-bytes: 1
      x-max-bytes: 72
    EmailInput:
      type: string
      description: |
        Plain email address. Surrounding whitespace is trimmed and the
        address is lowercased before validation. Display-name forms such
        as `Name <user@example.com>` are rejected.
      example: user@example.com
    PlaintextToken:
      type: string
      pattern: '^[1-9][0-9]*\|[A-Za-z0-9]{40}$'
      description: |
        Newly issued bearer credential. Its ID is a positive signed BIGINT
        database identifier and its secret is exactly 40 ASCII alphanumeric characters.
        Only login and token creation responses expose this value.
      example: 7|abcdefghijklmnopqrstuvwxyz0123456789ABCD
    NullData:
      type: object
      nullable: true
      enum: [null]
      description: Always the JSON null value.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: Username of 3–64 Unicode code points (Go runes).
          example: imgnest-user
        email:
          $ref: '#/components/schemas/EmailInput'
        password:
          $ref: '#/components/schemas/Password'
        captcha_token:
          $ref: '#/components/schemas/CaptchaToken'
    SsoExchangeRequest:
      type: object
      additionalProperties: false
      required: [ticket]
      properties:
        ticket:
          type: string
          description: One-time ticket from the /auth/sso redirect fragment.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/EmailInput'
        password:
          $ref: '#/components/schemas/CredentialPassword'
        captcha_token:
          $ref: '#/components/schemas/CaptchaToken'
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          $ref: '#/components/schemas/CredentialPassword'
        new_password:
          $ref: '#/components/schemas/Password'
    ProfileRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          maxLength: 64
          description: Trimmed server-side; empty clears the custom name.
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Token name; it must contain a non-whitespace character.
          example: blog-client
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional RFC3339 expiry later than the current time. Omitted
            or null means no expiry. Returned timestamps are normalized
            to UTC.
          example: '2026-11-04T00:00:00Z'
    UserView:
      type: object
      additionalProperties: false
      required: [id, display_name, group_id, username, email, role, status, used_bytes, created_at, avatar_provider, avatar_url, avatar_config_version]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        display_name:
          type: string
          maxLength: 64
          description: |
            Optional self-chosen profile name; empty means clients fall back
            to the username. Plain text only; control characters are rejected.
        group_id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [enabled, disabled]
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Storage usage in bytes.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        avatar_provider:
          type: string
          enum: [weavatar, gravatar]
          description: Site-wide avatar source that produced avatar_url.
        avatar_url:
          type: string
          nullable: true
          description: |
            HTTPS avatar address derived from the SHA-256 of the normalized
            account email; null means clients show the local default image.
            Computed server-side without contacting the avatar service.
        avatar_config_version:
          type: integer
          format: int64
          minimum: 0
          description: Site avatar configuration version; clients compare it to notice provider changes.
    TokenView:
      type: object
      additionalProperties: false
      required: [id, name, kind, abilities, expires_at, last_used_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        kind:
          type: string
          enum: [web, api]
        abilities:
          type: array
          minItems: 1
          maxItems: 1
          description: M1 supports only the single wildcard ability ["*"].
          items:
            type: string
            enum: ['*']
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_used_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    LoginData:
      type: object
      additionalProperties: false
      required: [token, user, expires_at]
      properties:
        token:
          $ref: '#/components/schemas/PlaintextToken'
        user:
          $ref: '#/components/schemas/UserView'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    SiteView:
      type: object
      additionalProperties: false
      required: [site_name, register_enabled, gallery_enabled, login_providers]
      properties:
        site_name:
          type: string
          minLength: 1
          description: Public site title; defaults to ImgNest until a configured name exists.
          example: ImgNest
        register_enabled:
          type: boolean
          description: Whether self-service registration currently accepts new users.
        gallery_enabled:
          type: boolean
          description: Whether the public gallery is open; when false the gallery API returns empty pages.
        login_providers:
          type: array
          description: Extra sign-in options contributed by server extensions; empty on a stock build.
          items:
            $ref: '#/components/schemas/LoginProvider'
    LoginProvider:
      type: object
      additionalProperties: false
      required: [id, name, start_url]
      properties:
        id:
          type: string
          description: Stable key, unique within the extension that provides it.
          example: github
        name:
          type: string
          description: Button label shown on the login page.
          example: GitHub
        start_url:
          type: string
          description: Same-origin path that starts the sign-in flow, under /api/ext/{plugin}.
          example: /api/ext/sso/github/start
    PolicySummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name:
          type: string
          description: Rule display name shown in the upload-page selector.
    IssuedToken:
      type: object
      additionalProperties: false
      required: [token, info]
      properties:
        token:
          $ref: '#/components/schemas/PlaintextToken'
        info:
          $ref: '#/components/schemas/TokenView'
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
          enum: [ok]
        data:
          description: Operation-specific success payload.
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ok]
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserView'
    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginData'
    TokenListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TokenView'
    IssuedTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/IssuedToken'
    SiteEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SiteView'
    PolicyListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PolicySummary'
    LskyCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, description: Written verbatim; never logged or echoed.}
    LskyEnvelope:
      type: object
      additionalProperties: false
      required: [status, message, data]
      properties:
        status: {type: boolean, description: The only field Lsky clients branch on.}
        message: {type: string}
        data: {description: Operation-specific payload; always an object, never null or an array at the top level.}
    LskyFailure:
      type: object
      additionalProperties: false
      description: Business failure; always paired with HTTP 200 so clients fall through their status check.
      required: [status, message, data]
      properties:
        status: {type: boolean, enum: [false]}
        message: {type: string, description: Human-readable reason without technical or credential details.}
        data: {type: object, additionalProperties: false}
    LskyNullEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {type: object, additionalProperties: false}
    LskyMessageEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            message: {type: string, enum: ["删除成功"]}
            data: {type: object, additionalProperties: false}
    LskyTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {$ref: '#/components/schemas/PlaintextToken'}
    LskyStrategiesEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [strategies]
              properties:
                strategies:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id: {$ref: '#/components/schemas/ID'}
                      name: {type: string}
    LskyUploadEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            message: {type: string, enum: ["上传成功"]}
            data: {$ref: '#/components/schemas/LskyUploadData'}
    LskyUploadData:
      type: object
      additionalProperties: false
      description: '`name` is the stored file name, `pathname` the storage path plus file name, `origin_name` the client filename, `size` is KB as a float.'
      required: [key, name, pathname, origin_name, size, mimetype, extension, md5, sha1, links]
      properties:
        key: {type: string}
        name: {type: string}
        pathname: {type: string}
        origin_name: {type: string}
        size: {type: number, format: double, minimum: 0, description: Stored original bytes divided by 1024.}
        mimetype: {type: string}
        extension: {type: string}
        md5: {type: string, description: MD5 of the stored original after metadata scrubbing.}
        sha1: {type: string, description: SHA-1 of the stored original after metadata scrubbing.}
        links: {$ref: '#/components/schemas/LskyUploadLinks'}
    LskyUploadLinks:
      allOf:
        - $ref: '#/components/schemas/LskyImageLinks'
        - type: object
          additionalProperties: false
          required: [origin_url, webp_url]
          properties:
            origin_url: {type: string, description: ImgNest extra; stored original URL, empty when only a WebP is stored.}
            webp_url: {type: string, description: ImgNest extra; empty when no WebP is stored.}
    LskyImageLinks:
      type: object
      additionalProperties: false
      required: [url, html, bbcode, markdown, markdown_with_link, thumbnail_url]
      properties:
        url: {type: string, description: The link clients paste; follows the rule's link_prefer.}
        html: {type: string, description: 'Exactly `&lt;img src="URL" alt="NAME" title="NAME" /&gt;` with only &, < and > escaped.'}
        bbcode: {type: string}
        markdown: {type: string}
        markdown_with_link: {type: string}
        thumbnail_url: {type: string, description: The cloud _thumbs.webp URL, or the image URL when no thumbnail is stored.}
    LskyImagePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LskyImagePage'}
    LskyImagePage:
      type: object
      additionalProperties: false
      description: Laravel paginator shape; from/to are null on an empty page and links is always an array.
      required: [current_page, data, first_page_url, from, last_page, last_page_url, links, next_page_url, path, per_page, prev_page_url, to, total]
      properties:
        current_page: {type: integer, minimum: 1}
        data:
          type: array
          items: {$ref: '#/components/schemas/LskyImageItem'}
        first_page_url: {type: string}
        from: {type: integer, nullable: true, minimum: 1}
        last_page: {type: integer, minimum: 1}
        last_page_url: {type: string}
        links: {type: array, items: {type: object, additionalProperties: true}}
        next_page_url: {type: string, nullable: true}
        path: {type: string, description: Absolute request origin plus the route path.}
        per_page: {type: integer, enum: [40]}
        prev_page_url: {type: string, nullable: true}
        to: {type: integer, nullable: true, minimum: 1}
        total: {type: integer, minimum: 0}
    LskyImageItem:
      type: object
      additionalProperties: false
      description: Never carries EXIF or GPS.
      required: [album, key, name, pathname, origin_name, size, mimetype, extension, md5, sha1, width, height, links, human_date, date]
      properties:
        album:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: {$ref: '#/components/schemas/ID'}
                name: {type: string}
          description: Present only while listing one album.
        key: {type: string}
        name: {type: string, description: Stored file name with extension.}
        pathname: {type: string, description: Storage path plus stored file name.}
        origin_name: {type: string, description: Client filename at upload time.}
        size: {type: number, format: double, minimum: 0, description: KB as a float.}
        mimetype: {type: string}
        extension: {type: string}
        md5: {type: string}
        sha1: {type: string}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        links: {$ref: '#/components/schemas/LskyImageLinks'}
        human_date: {type: string, description: Relative text such as 刚刚 or 3 分钟前.}
        date: {type: string, description: 'Y-m-d H:i:s.'}
    LskyAlbumPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LskyAlbumPage'}
    LskyAlbumPage:
      allOf:
        - $ref: '#/components/schemas/LskyImagePage'
        - type: object
          properties:
            data:
              type: array
              items: {$ref: '#/components/schemas/LskyAlbumItem'}
    LskyAlbumItem:
      type: object
      additionalProperties: false
      required: [id, name, intro, image_num]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        intro: {type: string}
        image_num: {type: integer, minimum: 0, description: Live count of active images.}
    LskyProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LskyProfileData'}
    LskyProfileData:
      type: object
      additionalProperties: false
      required: [name, avatar, email, capacity, used_capacity, url, image_num, album_num, registered_ip]
      properties:
        name: {type: string}
        avatar: {type: string, description: Always empty; ImgNest has no avatars.}
        email: {type: string}
        capacity: {type: number, format: double, minimum: 0, description: Group byte limit divided by 1024; 0 means unlimited.}
        used_capacity: {type: number, format: double, minimum: 0, description: Charged bytes divided by 1024.}
        url: {type: string, description: Always empty.}
        image_num: {type: integer, minimum: 0, description: Active images.}
        album_num: {type: integer, minimum: 0}
        registered_ip: {type: string, description: Address recorded at registration; may be empty.}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [10001, 10002, 10004, 20001, 20002, 20003, 30001, 30002, 30003, 30004, 30005, 30006, 30007, 30010, 30011, 30012, 50001, 50002, 50003, 50004]
        message:
          type: string
          description: Human-readable error message without technical or credential details.
        data:
          $ref: '#/components/schemas/NullData'
  responses:
    SearchInvalid:
      description: Invalid unified-search syntax, parameters, version, complexity or mixed protocol. No partial query is executed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SearchErrorEnvelope'}
    SearchAlbumUnavailable:
      description: An album is unavailable in the authorized scope or its exact name is ambiguous. Missing and inaccessible resources are indistinguishable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SearchErrorEnvelope'}
    CaptchaAdmin:
      description: Safe administrator snapshot after a successful read or mutation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CaptchaAdminEnvelope'}
    CaptchaFailed:
      description: Missing, oversized, expired, replayed, rejected, or action/hostname-mismatched challenge; code 30010. Obtain a fresh token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CaptchaConflict:
      description: Stale expected_version or concurrent modification; code 30011. Reload before retrying.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CaptchaConflictOrNotReady:
      description: Code 30011 for stale/concurrent version; code 30012 for absent candidate, missing/faded candidate tests, or missing compatibility acknowledgements.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    CaptchaUnavailable:
      description: Configuration storage, secret encryption/decryption, provider protocol, timeout, or provider service unavailable; code 50004. Protection stays enabled and no session is issued.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    LskyUnauthenticated:
      description: Missing, malformed, revoked or expired bearer token; never a silent downgrade to guest access.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LskyFailure'}
    LskyDisabled:
      description: The administrator disabled the v1 API; every /api/v1 route answers with this envelope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/LskyFailure'
              - type: object
                properties:
                  message: {type: string, enum: ["管理员未启用 API"]}
    LskyThrottled:
      description: Fixed window exceeded — three token attempts per client address per minute, or the group's upload rate.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/LskyFailure'
              - type: object
                properties:
