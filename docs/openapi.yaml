        password: {type: string, format: password, description: Written verbatim; never logged or echoed.}
    LskyEnvelope:
      type: object
      additionalProperties: false
      required: [status, message, data]
      properties:
        status: {type: boolean, description: The only field Lsky clients branch on.}
        message: {type: string}
        data: {description: Operation-specific payload; always an object, never null or an array at the top level.}
    LskyFailure:
      type: object
      additionalProperties: false
      description: Business failure; always paired with HTTP 200 so clients fall through their status check.
      required: [status, message, data]
      properties:
        status: {type: boolean, enum: [false]}
        message: {type: string, description: Human-readable reason without technical or credential details.}
        data: {type: object, additionalProperties: false}
    LskyNullEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {type: object, additionalProperties: false}
    LskyMessageEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            message: {type: string, enum: ["删除成功"]}
            data: {type: object, additionalProperties: false}
    LskyTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {$ref: '#/components/schemas/PlaintextToken'}
    LskyStrategiesEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [strategies]
              properties:
                strategies:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id: {$ref: '#/components/schemas/ID'}
                      name: {type: string}
    LskyUploadEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            message: {type: string, enum: ["上传成功"]}
            data: {$ref: '#/components/schemas/LskyUploadData'}
    LskyUploadData:
      type: object
      additionalProperties: false
      description: '`name` is the stored file name, `pathname` the storage path plus file name, `origin_name` the client filename, `size` is KB as a float.'
      required: [key, name, pathname, origin_name, size, mimetype, extension, md5, sha1, links]
      properties:
        key: {type: string}
        name: {type: string}
        pathname: {type: string}
        origin_name: {type: string}
        size: {type: number, format: double, minimum: 0, description: Stored original bytes divided by 1024.}
        mimetype: {type: string}
        extension: {type: string}
        md5: {type: string, description: MD5 of the stored original after metadata scrubbing.}
        sha1: {type: string, description: SHA-1 of the stored original after metadata scrubbing.}
        links: {$ref: '#/components/schemas/LskyUploadLinks'}
    LskyUploadLinks:
      allOf:
        - $ref: '#/components/schemas/LskyImageLinks'
        - type: object
          additionalProperties: false
          required: [origin_url, webp_url]
          properties:
            origin_url: {type: string, description: ImgNest extra; stored original URL, empty when only a WebP is stored.}
            webp_url: {type: string, description: ImgNest extra; empty when no WebP is stored.}
    LskyImageLinks:
      type: object
      additionalProperties: false
      required: [url, html, bbcode, markdown, markdown_with_link, thumbnail_url]
      properties:
        url: {type: string, description: The link clients paste; follows the rule's link_prefer.}
        html: {type: string, description: 'Exactly `&lt;img src="URL" alt="NAME" title="NAME" /&gt;` with only &, < and > escaped.'}
        bbcode: {type: string}
        markdown: {type: string}
        markdown_with_link: {type: string}
        thumbnail_url: {type: string, description: The cloud _thumbs.webp URL, or the image URL when no thumbnail is stored.}
    LskyImagePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LskyImagePage'}
    LskyImagePage:
      type: object
      additionalProperties: false
      description: Laravel paginator shape; from/to are null on an empty page and links is always an array.
      required: [current_page, data, first_page_url, from, last_page, last_page_url, links, next_page_url, path, per_page, prev_page_url, to, total]
      properties:
        current_page: {type: integer, minimum: 1}
        data:
          type: array
          items: {$ref: '#/components/schemas/LskyImageItem'}
        first_page_url: {type: string}
        from: {type: integer, nullable: true, minimum: 1}
        last_page: {type: integer, minimum: 1}
        last_page_url: {type: string}
        links: {type: array, items: {type: object, additionalProperties: true}}
        next_page_url: {type: string, nullable: true}
        path: {type: string, description: Absolute request origin plus the route path.}
        per_page: {type: integer, enum: [40]}
        prev_page_url: {type: string, nullable: true}
        to: {type: integer, nullable: true, minimum: 1}
        total: {type: integer, minimum: 0}
    LskyImageItem:
      type: object
      additionalProperties: false
      description: Never carries EXIF or GPS.
      required: [album, key, name, pathname, origin_name, size, mimetype, extension, md5, sha1, width, height, links, human_date, date]
      properties:
        album:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: {$ref: '#/components/schemas/ID'}
                name: {type: string}
          description: Present only while listing one album.
        key: {type: string}
        name: {type: string, description: Stored file name with extension.}
        pathname: {type: string, description: Storage path plus stored file name.}
        origin_name: {type: string, description: Client filename at upload time.}
        size: {type: number, format: double, minimum: 0, description: KB as a float.}
        mimetype: {type: string}
        extension: {type: string}
        md5: {type: string}
        sha1: {type: string}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        links: {$ref: '#/components/schemas/LskyImageLinks'}
        human_date: {type: string, description: Relative text such as 刚刚 or 3 分钟前.}
        date: {type: string, description: 'Y-m-d H:i:s.'}
    LskyAlbumPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LskyAlbumPage'}
    LskyAlbumPage:
      allOf:
        - $ref: '#/components/schemas/LskyImagePage'
        - type: object
          properties:
            data:
              type: array
              items: {$ref: '#/components/schemas/LskyAlbumItem'}
    LskyAlbumItem:
      type: object
      additionalProperties: false
      required: [id, name, intro, image_num]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        intro: {type: string}
        image_num: {type: integer, minimum: 0, description: Live count of active images.}
    LskyProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/LskyEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/LskyProfileData'}
    LskyProfileData:
      type: object
      additionalProperties: false
      required: [name, avatar, email, capacity, used_capacity, url, image_num, album_num, registered_ip]
      properties:
        name: {type: string}
        avatar: {type: string, description: Always empty; ImgNest has no avatars.}
        email: {type: string}
        capacity: {type: number, format: double, minimum: 0, description: Group byte limit divided by 1024; 0 means unlimited.}
        used_capacity: {type: number, format: double, minimum: 0, description: Charged bytes divided by 1024.}
        url: {type: string, description: Always empty.}
        image_num: {type: integer, minimum: 0, description: Active images.}
        album_num: {type: integer, minimum: 0}
        registered_ip: {type: string, description: Address recorded at registration; may be empty.}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [10001, 10002, 10004, 20001, 20002, 20003, 30001, 30002, 30003, 30004, 30005, 30006, 30007, 50001, 50002, 50003]
        message:
          type: string
          description: Human-readable error message without technical or credential details.
        data:
          $ref: '#/components/schemas/NullData'
  responses:
    LskyUnauthenticated:
      description: Missing, malformed, revoked or expired bearer token; never a silent downgrade to guest access.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LskyFailure'}
    LskyDisabled:
      description: The administrator disabled the v1 API; every /api/v1 route answers with this envelope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/LskyFailure'
              - type: object
                properties:
                  message: {type: string, enum: ["管理员未启用 API"]}
    LskyThrottled:
      description: Fixed window exceeded — three token attempts per client address per minute, or the group's upload rate.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/LskyFailure'
              - type: object
                properties:
                  message: {type: string, enum: ["Too Many Attempts."]}
    ImageFailure:
      description: |
        Native error envelope. 400/10001 invalid input; 401/20001 missing or
        revoked authentication; 403/20003 forbidden; 404/10001 missing image;
        413/10002 byte limit; 408/10004 cancellation/deadline; 429/30003 upload
        rate; 403/30004 quota; 409/30005 path conflict; 409/30006 in-progress
        image operation; 415/30007 disallowed format; 502/50002 storage failure;
        422/50003 processing or privacy-sanitization failure; 500/50001 other
        internal failure. No private source data or provider diagnostics are returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InvalidInput:
      description: Invalid JSON, unknown fields, invalid path ID, or invalid input; code 10001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [10001]
    Unauthenticated:
      description: Missing, malformed, expired, revoked, or otherwise invalid bearer token; code 20001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [20001]
    InvalidCredentials:
      description: Incorrect email/password or disabled account; code 20002.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [20002]
    Forbidden:
      description: Token does not belong to the authenticated user or does not exist; code 20003.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [20003]
    RegistrationDisabled:
      description: Site registration is disabled; code 30001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30001]
    UserExists:
      description: Username or email is already registered; code 30002.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30002]
    RateLimited:
      description: More than three registration or login requests per minute from the same client IP; code 30003.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30003]

    InternalError:
      description: Internal operation or database health check failed; code 50001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [50001]
    AdminForbidden:
      description: Authenticated caller is not an administrator; code 20003.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [20003]
    NotFound:
      description: Referenced account, group, storage, rule, or image does not exist; code 10001.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [10001]
    ImageBusy:
      description: Image operation already in progress; code 30006.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30006]
    GroupHasMembers:
      description: Group still has member accounts; code 30008.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30008]
    StillReferenced:
      description: Storage, rule, or group is still referenced by other records; code 30009.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [30009]
    StorageFailed:
      description: Storage backend operation failed; code 50002.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [50002]
