openapi: 3.0.3
info:
  title: ImgNest Native API
  version: M3
  description: |
    Account, token, and image API. Every API response uses the native
    `{code, message, data}` envelope. Success has code 0 and message `ok`;
    failures have a nonzero business code and data `null`.
    Response timestamps are UTC RFC3339. Passwords, credential hashes,
    and token hashes are never returned. Plaintext tokens are returned
    only by login and token creation.
    JSON request bodies are limited to 64 KiB. Malformed JSON, additional
    fields, multiple JSON values, and trailing non-whitespace data are
    rejected with HTTP 400 and code 10001.
    Image bodies at /i and /t use binary responses instead of this envelope.
servers:
  - url: /
    description: Current ImgNest origin
tags:
  - name: Health
  - name: Site
  - name: Authentication
  - name: Tokens
  - name: Images
  - name: Policies
  - name: Trash
  - name: Lsky v1
  - name: Admin
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check application and database health
      security: []
      responses:
        '200':
          description: Application and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          $ref: '#/components/responses/InternalError'
  /api/site:
    get:
      operationId: getSite
      tags: [Site]
      summary: Read the public site descriptor
      description: |
        Public endpoint without authentication. It returns only the site name
        and the registration switch; no other settings keys are exposed.
        The site name defaults to `ImgNest` until a configured name exists.
      security: []
      responses:
        '200':
          description: Public site descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/policies:
    get:
      operationId: listPolicies
      tags: [Policies]
      summary: List the rules the authenticated user may upload through
      description: |
        Returns the enabled rules bound to the authenticated user's group whose
        storage backend is enabled, ordered by ID — the same grant semantics
        the upload endpoint enforces, so every listed rule is acceptable to
        upload. A group without eligible bindings yields data `[]`, never null.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permitted rules for the upload-page selector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      summary: Register an ordinary user
      description: |
        Registration must be enabled by the site administrator. The server
        assigns role `user` and the default group; clients cannot set role,
        group_id, or other account attributes. Limited to three requests
        per minute per client IP, independently of the login limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created. No token is issued by registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/RegistrationDisabled'
        '409':
          $ref: '#/components/responses/UserExists'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Log in and issue a web token
      description: |
        A successful login issues a web token that expires in 24 hours.
        Copy the token from this response; it cannot be retrieved later.
        Limited to three requests per minute per client IP, independently
        of the registration limit. Disabled users cannot log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted and web token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enabled user associated with the bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Revoke the current bearer token
      description: Other tokens belonging to the user remain active.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current token revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password:
    patch:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the password and revoke all user tokens
      description: |
        Requires the current password. A successful change revokes every
        token owned by the user, including the token used for this request.
        Log in again with the new password to obtain a new web token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '200':
          description: Password changed and all tokens revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: |
            Code 20001 means the bearer token is missing or invalid.
            Code 20002 means the current password is incorrect.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code:
                        type: integer
                        enum: [20001, 20002]
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tokens:
    get:
      operationId: listTokens
      tags: [Tokens]
      summary: List the authenticated user's token metadata
      description: |
        Returns an array of TokenView objects. An empty list has data `[]`.
        The plaintext secret and token hash are never included.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token metadata owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createToken
      tags: [Tokens]
      summary: Create an API token
      description: |
        The server assigns kind `api` and abilities `["*"]`. These fields
        cannot be provided by clients in M1. The expiry may be omitted or
        null for an API token without an expiry; otherwise it must be later
        than the current time. The plaintext token is returned only once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: API token created, with plaintext and safe metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedTokenEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [Tokens]
      summary: Revoke an owned token
      description: |
        A token belonging to another user and a nonexistent token both
        return 403 with code 20003 to avoid disclosing token ownership.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Positive signed BIGINT token identifier.
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Owned token revoked; data is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/upload:
    post:
      operationId: uploadImages
      tags: [Images]
      summary: Upload one or more images with independent compensation
      description: |
        Requires a valid bearer token. Authentication and default-group upload
        preflight happen before the request body is read. Multipart parts are
        read into bounded memory; source images are never spooled to temporary
        files. Metadata fields may occur before or after file parts, but may
        not be repeated. Unknown fields are rejected. The selected policy is
        checked again before processing. Real image format is detected from
        bytes by the shared image service, not from filenames or Content-Type.
        Defaults: 64 MiB total request, at most 20 files, two concurrent upload
        requests, five-minute request deadline. Group and deployment file caps
        also apply. File-level failures do not roll back successful siblings.
        A single file returns its ImageView with HTTP 201 or a normal error;
        multiple files return HTTP 207 with one result per file, in input order.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [file]
                - required: ['files[]']
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, format: binary}
                  description: Repeat the file part for multiple images; file or files[] is required.
                'files[]':
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, format: binary}
                  description: Alternative repeatable file-part name.
                policy_id:
                  $ref: '#/components/schemas/ID'
                album_id:
                  $ref: '#/components/schemas/ID'
                is_public:
                  type: boolean
                  default: false
                  description: Multipart text must be exactly true or false.
      responses:
        '201':
          description: One image committed, including all declared variants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        '207':
          description: Per-file results; inspect every item's status and code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        '413':
          description: Request or file exceeds its byte limit; code 10002.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '408':
          description: Request canceled or upload deadline exceeded; code 10004.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images:
    get:
      operationId: listImages
      tags: [Images]
      summary: List the authenticated user's active images
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
      responses:
        '200':
          description: Image page without EXIF, source IP, or storage credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/{id}:
    parameters:
      - $ref: '#/components/parameters/ImageID'
    get:
      operationId: getImage
      tags: [Images]
      summary: Read an owner-authorized image
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Image metadata without EXIF.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    patch:
      operationId: setImageVisibility
      tags: [Images]
      summary: Change public-list visibility
      description: Private images remain accessible to anyone holding their direct object link.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [is_public]
              properties:
                is_public: {type: boolean}
      responses:
        '200':
          description: Updated image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
    delete:
      operationId: trashImage
      tags: [Images]
      summary: Move an image into the recycle bin
      description: Successful completion removes the original keys from the origin; CDN cache purging is outside this contract.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Image moved to trash; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/{id}/exif:
    get:
      operationId: getImageExif
      tags: [Images]
      summary: Read full owner/admin metadata, including GPS
      description: This authenticated endpoint is the only image API returning GPS and raw metadata.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImageID'
      responses:
        '200':
          description: Private metadata; response is not cached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageExifEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/images/batch:
    post:
      operationId: batchImages
      tags: [Images]
      summary: Delete images or change their visibility individually
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, ids]
              properties:
                action: {type: string, enum: [delete, permission]}
                ids: {$ref: '#/components/schemas/ImageIDs'}
                is_public:
                  type: boolean
                  description: Required for permission; must be omitted for delete.
      responses:
        '207':
          description: Per-ID status, preserving the requested ID order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash:
    get:
      operationId: listTrash
      tags: [Trash]
      summary: List the authenticated user's recycle bin
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ImagePageNumber'
        - $ref: '#/components/parameters/ImagePageSize'
      responses:
        '200':
          description: Recycle-bin page with retained local thumbnail references.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash/restore:
    post:
      operationId: restoreImages
      tags: [Trash]
      summary: Restore selected images to their original paths
      description: Authorization and current capacity are rechecked before activation.
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/ImageSelection'
      responses:
        '207':
          description: Per-ID restore results; successful data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/trash/purge:
    post:
      operationId: purgeImages
      tags: [Trash]
      summary: Permanently remove selected trashed images
      description: Removes owned object history and deletion markers before releasing the image path reservation.
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/ImageSelection'
      responses:
        '207':
          description: Per-ID purge results; successful data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageBatchEnvelope'}
        default:
          $ref: '#/components/responses/ImageFailure'
  /i/{storageID}/{key}:
    parameters:
      - name: storageID
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ID'}
      - name: key
        in: path
        required: true
        description: Canonical object key, possibly containing slash-separated path segments, with its extension.
        schema: {type: string}
    get:
      operationId: getLocalImageObject
      tags: [Images]
      summary: Read an active local object using its direct link
      description: Private display visibility does not restrict direct links. Pending, deleted, and undeclared objects return 404.
      security: []
      responses:
        '200':
          description: Raw image bytes with Content-Length and the detected image MIME type.
          content:
            image/*:
              schema: {type: string, format: binary}
        '302':
          description: Requested WebP was skipped; Location points to the stored original.
          headers:
            Location: {schema: {type: string}}
        default:
          $ref: '#/components/responses/ImageFailure'
    head:
      operationId: headLocalImageObject
      tags: [Images]
      summary: Read local-object headers without its body
      security: []
      responses:
        '200': {description: Image headers without bytes.}
        '302': {description: WebP fallback redirect.}
        default:
          $ref: '#/components/responses/ImageFailure'
  /t/{key}.webp:
    parameters:
      - name: key
        in: path
        required: true
        description: Stable opaque image key, excluding the .webp suffix.
        schema: {type: string}
    get:
      operationId: getImageThumbnail
      tags: [Images]
      summary: Read or lazily refill the local thumbnail cache
      description: Public thumbnails allow anonymous requests. Private thumbnails require the owner or an administrator. A supplied invalid Bearer token is rejected.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Raw WebP thumbnail, without metadata.
          content:
            image/webp:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/ImageFailure'
    head:
      operationId: headImageThumbnail
      tags: [Images]
      summary: Read authorized thumbnail headers without its body
      security:
        - {}
        - bearerAuth: []
      responses:
        '200': {description: Thumbnail headers without bytes.}
        default:
          $ref: '#/components/responses/ImageFailure'
  /api/v1/tokens:
    post:
      operationId: v1CreateToken
      tags: [Lsky v1]
      summary: Exchange account credentials for an API token
      description: |
        Lsky Pro compatible token endpoint. The credentials may arrive as a
        JSON object or a form body. Issuance is throttled to three attempts
        per client address per minute; the fourth attempt within a window is
        rejected with 429. Wrong credentials stay a business failure (HTTP 200
        with `status: false`) so existing clients only branch on `status`.
        The returned plaintext token is shown exactly once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LskyCredentials'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/LskyCredentials'}
      responses:
        '200':
          description: Issued token, or the wrong-credentials failure envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyTokenEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '403':
          $ref: '#/components/responses/LskyDisabled'
        '429':
          $ref: '#/components/responses/LskyThrottled'
    delete:
      operationId: v1RevokeTokens
      tags: [Lsky v1]
      summary: Revoke every token of the authenticated account
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All API and web tokens of the account are revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyNullEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/strategies:
    get:
      operationId: v1ListStrategies
      tags: [Lsky v1]
      summary: List the upload strategies available to the caller
      description: |
        Returns the enabled rules bound to the caller's group, ordered by ID —
        the same grants the upload endpoint enforces. Without a token the list
        describes the guest group and stays empty unless guest uploads are
        enabled. A bearer token that fails authentication is rejected; it is
        never downgraded to guest access.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Strategy list; empty but never null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyStrategiesEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/upload:
    post:
      operationId: v1Upload
      tags: [Lsky v1]
      summary: Upload one image (Lsky compatible multipart)
      description: |
        Works with a bearer token or, when the administrator enabled guest
        uploads, anonymously. A present but invalid Authorization header is
        always rejected with 401 — it never falls back to guest access.
        The multipart body carries exactly one `file` part plus the optional
        `strategy_id`, `album_id` and `permission` (1 public, 0 private)
        fields. Format detection uses the file header, never the extension,
        and SVG is refused. Business failures (quota, disallowed format,
        oversized file, unknown strategy) stay HTTP 200 with `status: false`.
        `size` is kilobytes as a float; `pathname` is the stored path plus
        file name; `links.url` follows the rule's `link_prefer`. EXIF and GPS
        never appear in the response.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: Exactly one image part.}
                strategy_id: {type: string, description: Numeric rule ID; the group default when absent.}
                album_id: {type: string, description: Numeric album ID. Guests cannot use albums.}
                permission: {type: string, enum: ['0', '1'], description: 1 public, 0 private; private when absent.}
      responses:
        '200':
          description: Upload result, or the business-failure envelope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyUploadEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
        '429':
          $ref: '#/components/responses/LskyThrottled'
  /api/v1/images:
    get:
      operationId: v1ListImages
      tags: [Lsky v1]
      summary: Page the authenticated account's images
      description: |
        Lsky paginator semantics: 40 items per page and the full Laravel
        field set. The Lsky quirk stands — a missing or zero `album_id`
        selects only images that are not assigned to any album; a non-zero
        value lists that album and attaches its `{id, name}` to every item.
        Items never carry EXIF or GPS.
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: order
          in: query
          schema: {type: string, enum: [newest, earliest, utmost, least], default: newest, description: utmost sorts by size descending.}
        - name: permission
          in: query
          schema: {type: string, enum: [all, public, private], default: all}
        - name: album_id
          in: query
          schema: {type: integer, minimum: 0, description: Zero or absent selects unassigned images.}
        - name: keyword
          in: query
          schema: {type: string, description: Literal substring match on the original or stored file name.}
      responses:
        '200':
          description: Laravel-shaped image page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyImagePageEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/images/{key}:
    delete:
      operationId: v1DeleteImage
      tags: [Lsky v1]
      summary: Move one owned image into the recycle bin
      description: |
        The public URL stops resolving immediately; the objects themselves are
        purged after the retention window. Unknown keys and foreign images are
        business failures with `status: false`, not HTTP errors.
      security: [{bearerAuth: []}]
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Deletion accepted or rejected; clients branch on `status`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyNullEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/albums:
    get:
      operationId: v1ListAlbums
      tags: [Lsky v1]
      summary: Page the authenticated account's albums
      description: 40 items per page; `image_num` always reflects the live number of active images.
      security: [{bearerAuth: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: order
          in: query
          schema: {type: string, enum: [newest, earliest, most, least], default: newest, description: most/least sort by image count.}
        - name: keyword
          in: query
          schema: {type: string, description: Literal substring match on name or intro.}
      responses:
        '200':
          description: Laravel-shaped album page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyAlbumPageEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/albums/{id}:
    delete:
      operationId: v1DeleteAlbum
      tags: [Lsky v1]
      summary: Delete one owned album; its images stay
      description: The images themselves are kept and their album reference is cleared, so they reappear as unassigned.
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Deletion accepted or rejected; clients branch on `status`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LskyMessageEnvelope'
                  - $ref: '#/components/schemas/LskyFailure'
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/v1/profile:
    get:
      operationId: v1GetProfile
      tags: [Lsky v1]
      summary: Read the authenticated account's profile and capacity
      description: '`capacity` and `used_capacity` are kilobytes as floats; a group without a byte limit reports capacity 0.'
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Account profile in the Lsky field set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LskyProfileEnvelope'}
        '401':
          $ref: '#/components/responses/LskyUnauthenticated'
        '403':
          $ref: '#/components/responses/LskyDisabled'
  /api/admin/users:
    get:
      operationId: adminListUsers
      tags: [Admin]
      summary: List every account with pagination and an optional keyword
      description: |
        Requires the administrator role; any other authenticated caller is
        rejected with 403/code 20003. The never-authenticating guest anchor
        row is not a manageable account and never appears. `keyword` matches
        substring-wise against username and email.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImagePageNumber'}
        - {$ref: '#/components/parameters/ImagePageSize'}
        - {name: keyword, in: query, schema: {type: string}}
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPageEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/users/{id}:
    patch:
      operationId: adminPatchUser
      tags: [Admin]
      summary: Change an account's status or group
      description: |
        Requires the administrator role. `status` accepts only `enabled` and
        `disabled`; disabling an account revokes every one of its bearer
        credentials in the same transaction as the status flip. An
        administrator cannot disable their own account. `group_id` must name
        an existing non-guest group. There is no way to change a role through
        this endpoint.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserPatch'}
      responses:
        '200':
          description: The updated account view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/groups:
    get:
      operationId: adminListGroups
      tags: [Admin]
      summary: List every group with member counts and rule bindings
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All groups in database ID order; the array is never null.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/GroupView'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: adminCreateGroup
      tags: [Admin]
      summary: Create a group
      description: |
        Requires the administrator role. The default and guest roles are
        structural: at most one group of each kind may exist and the flags
        are fixed at creation. `default_policy_id` must be part of
        `policy_ids`; every bound rule must exist.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupInput'}
      responses:
        '201':
          description: The created group view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/groups/{id}:
    patch:
      operationId: adminPatchGroup
      tags: [Admin]
      summary: Change a group's quotas or rule bindings
      description: |
        Requires the administrator role. Only the supplied fields change. The
        default/guest flags have no request shape. A nonzero
        `default_policy_id` must stay inside the resulting `policy_ids`.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupPatch'}
      responses:
        '200':
          description: The updated group view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminDeleteGroup
      tags: [Admin]
      summary: Delete an empty, unreferenced, non-structural group
      description: |
        Requires the administrator role. The default and guest groups are
        protected (403/20003). A group with members returns 409/30008; a
        group a settings key still points at returns 409/30009. Deletion
        never cascades to accounts.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Group deleted; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GroupHasMembers'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/storages:
    get:
      operationId: adminListStorages
      tags: [Admin]
      summary: List every storage backend without any configuration
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All backends in database ID order; no config or secret is ever included.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/StorageView'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: adminCreateStorage
      tags: [Admin]
      summary: Create and connectivity-test a storage backend
      description: |
        Requires the administrator role. Uses the same provisioning path as
        the host setup command: S3 configurations are sealed with the
        deployment master key before persistence and the backend must pass a
        put/copy/delete probe. The response never contains the configuration.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageInput'}
      responses:
        '201':
          description: The created backend view without configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/storages/{id}:
    patch:
      operationId: adminPatchStorage
      tags: [Admin]
      summary: Change a backend's name, base URL, switch, or configuration
      description: |
        Requires the administrator role. A supplied `config` replaces the
        stored configuration wholesale (re-sealed for S3) and must pass the
        connectivity probe before the change is persisted. The configuration
        is never part of any response.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoragePatch'}
      responses:
        '200':
          description: The updated backend view without configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminDeleteStorage
      tags: [Admin]
      summary: Delete a backend no rule references
      description: |
        Requires the administrator role. Backends still referenced by any
        upload rule return 409/30009; references are re-checked inside the
        deleting transaction.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Storage deleted; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StillReferenced'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/storages/{id}/test:
    post:
      operationId: adminTestStorage
      tags: [Admin]
      summary: Run the put/copy/delete connectivity probe
      description: |
        Requires the administrator role. Writes, copies, and deletes private
        probe objects only; no user data is touched. Each capability is
        reported separately and probe objects are always cleaned up.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Per-check probe results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageTestEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/policies:
    get:
      operationId: adminListPolicies
      tags: [Admin]
      summary: List every upload rule
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All rules in database ID order; the array is never null.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data]
                properties:
                  code: {type: integer, enum: [0]}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/PolicyView'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: adminCreatePolicy
      tags: [Admin]
      summary: Create an upload rule from documented defaults plus overrides
      description: |
        Requires the administrator role. `name` and `storage_id` are required;
        every other field falls back to the documented conservative defaults.
        Path templates are validated before persistence. Rules are created
        unbound and become usable once a group binds them.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyInput'}
      responses:
        '201':
          description: The created rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/policies/preview:
    post:
      operationId: adminPreviewPolicy
      tags: [Admin]
      summary: Render one sample path for path/name templates
      description: |
        Requires the administrator role. The sample uses the current time,
        the caller's account ID, the filename `example.jpg`, and fixed
        example content digests. Template failures return HTTP 200 with a
        non-empty `error` and an empty `sample`; the diagnostic is a static
        template message.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyPreviewRequest'}
      responses:
        '200':
          description: Sample path or template diagnostic.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyPreviewEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /api/admin/policies/{id}:
    patch:
      operationId: adminPatchPolicy
      tags: [Admin]
      summary: Change rule fields
      description: |
        Requires the administrator role. Only the supplied fields change and
        the final state is validated exactly like creation, including the
        path templates and the enabled storage backend.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyPatch'}
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminDeletePolicy
      tags: [Admin]
      summary: Delete an unreferenced rule
      description: |
        Requires the administrator role. Rules still referenced by images or
        as a group's default return 409/30009.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Rule deleted; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StillReferenced'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/settings:
    get:
      operationId: adminGetSettings
      tags: [Admin]
      summary: Read the full site configuration
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All eight settings with documented defaults for unset keys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: adminPutSettings
      tags: [Admin]
      summary: Change the supplied settings keys
      description: |
        Requires the administrator role. Partial update: only the fields
        present in the body are written, then the full configuration is
        returned. `site_name` must be 1-100 characters, `trash_days` 0-36500,
        `default_group_id` must name an existing group, and `guest_group_id`
        either 0 or an existing group.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminSettingsPatch'}
      responses:
        '200':
          description: The saved configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/images:
    get:
      operationId: adminListImages
      tags: [Admin]
      summary: List every active image site-wide
      description: |
        Requires the administrator role. Returns the same safe image views as
        the owner listing. `user_id` filters by owner; `keyword` matches the
        original filename or the stored pathname.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImagePageNumber'}
        - {$ref: '#/components/parameters/ImagePageSize'}
        - {name: user_id, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: keyword, in: query, schema: {type: string}}
      responses:
        '200':
          description: One site-wide page of images.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagePageEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/images/{id}:
    delete:
      operationId: adminDeleteImage
      tags: [Admin]
      summary: Move any owner's image into the recycle bin
      description: |
        Requires the administrator role. The owner-facing pipeline runs
        unchanged: original URLs 404 immediately and physical deletion
        follows the recycle-bin retention.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/ImageID'}
      responses:
        '200':
          description: Image recycled; data is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullEnvelope'}
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ImageBusy'
        '502':
          $ref: '#/components/responses/StorageFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/trash/purge-all:
    post:
      operationId: adminPurgeAllTrash
      tags: [Admin]
      summary: Physically purge the entire site-wide recycle bin
      description: |
        Requires the administrator role. Every recycled image goes through
        the regular per-image purge path one at a time. When any purge fails
        the response keeps its partial progress visible: HTTP 502/code 50002
        with `data.purged` counting the images that were fully removed.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Every recycled image was purged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrashPurgeEnvelope'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '502':
          description: Some images could not be purged; data carries the successful count.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      code: {type: integer, enum: [50002]}
                      data:
                        type: object
                        additionalProperties: false
                        required: [purged]
                        properties:
                          purged: {type: integer, format: int64, minimum: 0}
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    ImageID:
      name: id
      in: path
      required: true
      description: Authenticated native numeric image identifier.
      schema: {$ref: '#/components/schemas/ID'}
    ImagePageNumber:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    ImagePageSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  requestBodies:
    ImageSelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ids]
            properties:
              ids: {$ref: '#/components/schemas/ImageIDs'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: '<id>|<40 alphanumeric characters>'
      description: |
        Send `Authorization: Bearer <token>`. The token consists of a
        positive signed BIGINT ID, a pipe, and exactly 40 ASCII
        alphanumeric characters. Expired or revoked tokens and tokens
        owned by disabled users are rejected with 401/code 20001.
  schemas:
    AdminUserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: {type: string, enum: [enabled, disabled]}
        group_id: {$ref: '#/components/schemas/ID'}
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UserView'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    GroupView:
      type: object
      additionalProperties: false
      required: [id, name, is_default, is_guest, capacity_bytes, max_file_bytes, allowed_exts, upload_per_min, default_policy_id, policy_ids, user_count]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        is_default: {type: boolean}
        is_guest: {type: boolean}
        capacity_bytes: {type: integer, format: int64, minimum: 0, description: Zero means unlimited.}
        max_file_bytes: {type: integer, format: int64, minimum: 0, description: Zero means the deployment cap.}
        allowed_exts:
