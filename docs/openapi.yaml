      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ImageView'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    ImageExif:
      type: object
      additionalProperties: false
      required: [image_id, make, model, lens, exposure, f_number, focal_length, iso, orientation, taken_at, gps_lat, gps_lng, gps_alt, raw, created_at, updated_at]
      properties:
