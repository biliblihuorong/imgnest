<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <style>
    .photo { animation: settle 1.6s cubic-bezier(.45,0,.25,1) infinite; }
    .sun { transform-origin: 16.4px 12.2px; animation: glow 1.6s ease-in-out infinite; }
    @keyframes settle { 0%, 100% { transform: translateY(-2.2px); } 50% { transform: translateY(1.2px); } }
    @keyframes glow { 0%, 100% { transform: scale(.8); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .photo, .sun { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82ff"/>
      <stop offset="1" stop-color="#5b4bff"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <g transform="translate(0 1.5)">
  <g class="photo">
    <rect x="11" y="7" width="18" height="16" rx="3.5" fill="#fff"/>
    <circle class="sun" cx="16.4" cy="12.2" r="2" fill="#ffb547"/>
    <path d="M12.5 21.5 18 15.8l3.4 3.4 2.4-2.4 4.2 4.2" stroke="#4a63ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M6.5 20.5h27a13.5 9.5 0 0 1-27 0Z" fill="#fff"/>
  <path d="M10.5 24.6c5.6 2.2 13.4 2.2 19 0M13.6 28.1c4.4 1.4 8.4 1.4 12.8 0" stroke="#4a63ff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
